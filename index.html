<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Морський бій">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Морський бій</title>
<style>
/* ===== 1. Теми ===== */
:root{--paper:#dce8e6;--line:rgba(18,48,63,.06);--ink:#12303f;--sea:#c3dbe0;--grid:#93b5bd;--hit:#d2452f;--win:#2e8b57;--btn:#0f5c6e;--mut:#4d6b78;--card:rgba(255,255,255,.5);--hd:rgba(255,255,255,.7);--hl:rgba(255,255,255,.22);--hs:rgba(0,0,0,.28);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f2230;--line:rgba(220,232,230,.05);--ink:#dce8e6;--sea:#17394a;--grid:#2c5a6c;--win:#3fae76;--btn:#2a8aa0;--mut:#9fbac4;--card:rgba(255,255,255,.04);--hd:rgba(15,34,48,.65);--hl:rgba(15,34,48,.3);--hs:rgba(15,34,48,.3);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f2230;--line:rgba(220,232,230,.05);--ink:#dce8e6;--sea:#17394a;--grid:#2c5a6c;--win:#3fae76;--btn:#2a8aa0;--mut:#9fbac4;--card:rgba(255,255,255,.04);--hd:rgba(15,34,48,.65);--hl:rgba(15,34,48,.3);--hs:rgba(15,34,48,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

/* ===== 2. База ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px}
#app{max-width:460px;margin:0 auto;padding:12px 14px 28px}
h2{font:700 20px system-ui;margin:6px 0 4px}
p{margin:6px 0}
.mut{color:var(--mut)}
.lbl{font:700 12px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.top h1{font:italic 700 28px Georgia,serif;margin:0}
.err{color:var(--hit);min-height:22px;font-weight:600}
.link{color:var(--mut);text-decoration:underline}

/* ===== 3. Компоненти ===== */
button,textarea,input{font:inherit;border-radius:10px}
.b{display:block;width:100%;padding:14px;border:0;background:var(--btn);color:#fff;font-weight:600;margin:10px 0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.b.sec{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.b:disabled{opacity:.4}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{flex:1;min-width:64px;padding:10px 6px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600}
.chip.on{background:var(--ink);color:var(--paper)}
.chip:disabled{opacity:.35}
textarea,input{-webkit-user-select:text;user-select:text}
textarea,.codein{width:100%;border:2px solid var(--ink);background:var(--sea);color:var(--ink);padding:10px}
textarea{height:110px;font:13px/1.3 ui-monospace,Menlo,monospace;word-break:break-all}
.codein{font:700 28px Georgia,serif;letter-spacing:.3em;text-align:center}
.code{font:700 64px Georgia,serif;letter-spacing:.12em;text-align:center;margin:20px 0}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px;box-shadow:0 2px 0 rgba(18,48,63,.18),0 8px 20px rgba(18,48,63,.12)}
.status{padding:10px 12px;border-left:5px solid var(--btn);background:rgba(127,127,127,.15);border-radius:0 10px 10px 0;margin:8px 0;font-weight:600}
.status.you{border-color:var(--hit)}
.status.ok{border-color:var(--win)}
.last{margin:4px 2px;color:var(--mut)}
.last.hit b{color:var(--hit)}
.pills{display:flex;gap:8px;margin:0 0 8px}
.pills span{flex:1;text-align:center;padding:6px;border:2px solid var(--ink);border-radius:999px;font-size:14px}
.pills b{font-size:17px}
.banner{padding:14px;border-radius:14px;border:2px solid var(--ink);margin:6px 0 10px}
.banner h2{margin:0;font-size:26px}
.banner.win{border-color:var(--win)}.banner.win h2{color:var(--win)}
.banner.lose{border-color:var(--hit)}.banner.lose h2{color:var(--hit)}

/* ===== 4. Поле бою ===== */
.bhead{display:flex;align-items:flex-end;justify-content:space-between;margin:10px 2px 6px;min-height:44px}
.fleetbtn{position:relative;width:44px;height:44px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center}
.fleetbtn:active{transform:scale(.94)}
.badge{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--hit);color:#fff;font:700 12px system-ui;display:grid;place-items:center}
.board{display:grid;grid-template-columns:1.5em 1fr;gap:2px}
.cols{display:grid;grid-template-columns:repeat(10,1fr)}
.rows{display:grid;grid-template-rows:repeat(10,1fr)}
.cols b,.rows b{font:600 11px system-ui;color:var(--mut);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(10,1fr);border:2px solid var(--ink);border-radius:6px;background:var(--sea)}
.c{aspect-ratio:1;border:.5px solid var(--grid);position:relative}
.c.m::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--ink);opacity:.55}
.c.h::before,.c.h::after{content:"";position:absolute;left:12%;right:12%;top:47%;height:6%;min-height:2px;background:var(--hit)}
.c.h::before{transform:rotate(45deg)}
.c.h::after{transform:rotate(-45deg)}
.c.s.h{background:#5a2a24}
/* корпус корабля: клітинки поля, панель кораблів, «привид» при перетягуванні */
.hull{border-color:var(--ink);background:
  radial-gradient(circle,var(--hd) 0 9%,transparent 10%) 50% 27%/34% 34% no-repeat,
  linear-gradient(var(--hl),var(--hl)) 50% 72%/78% 11% no-repeat,
  linear-gradient(var(--hs),var(--hs)) 50% 100%/100% 16% no-repeat,
  var(--ink)}
.hull.vv{background:
  radial-gradient(circle,var(--hd) 0 9%,transparent 10%) 27% 50%/34% 34% no-repeat,
  linear-gradient(var(--hl),var(--hl)) 72% 50%/11% 78% no-repeat,
  linear-gradient(var(--hs),var(--hs)) 100% 50%/16% 100% no-repeat,
  var(--ink)}
.hull.hh.sb{border-radius:60% 6% 6% 60%}
.hull.hh.se{border-radius:6% 40% 40% 6%}
.hull.vv.sb{border-radius:60% 60% 6% 6%}
.hull.vv.se{border-radius:6% 6% 40% 40%}
.hull.sg{border-radius:45%}
.c.t{outline:3px solid var(--hit);outline-offset:-3px;z-index:1}

/* ===== 5. Анімації ===== */
.enter{animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.c.a-hit{animation:hitpop .7s ease-out;z-index:2}
@keyframes hitpop{0%{transform:scale(.3);background:var(--hit)}45%{transform:scale(1.6);background:var(--hit);box-shadow:0 0 0 5px rgba(210,69,47,.45)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(210,69,47,0)}}
.c.a-miss{z-index:2}
.c.a-miss::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--ink);animation:ring .8s ease-out forwards}
.c.a-miss::after{animation:dot .45s ease-out}
@keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(2.8);opacity:0}}
@keyframes dot{from{transform:scale(0)}to{transform:scale(1)}}
.c.t.w{animation:pulse .45s infinite alternate}
@keyframes pulse{to{background:rgba(210,69,47,.4)}}

/* ===== 6. Панель флоту суперника ===== */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(5,20,30,.6);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:340px;padding:18px;background:var(--paper);border:2px solid var(--ink);border-radius:16px}
.sheet h2{margin:0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--grid)}
.fname{font-weight:600;font-size:14px}
.ships{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;gap:0}
.seg i{display:block;width:16px;height:16px;border:.5px solid var(--ink)}
.seg.dead i{background:var(--hit);opacity:.45}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 0}

/* ===== 7. Панель кораблів і перетягування ===== */
.dock{display:flex;flex-wrap:wrap;gap:12px 20px;margin:10px 0;padding:10px;border:2px dashed var(--grid);border-radius:12px;min-height:64px;align-items:flex-end}
.dockitem{display:flex;align-items:flex-end;gap:6px}
.dockitem small{color:var(--mut);font-weight:700}
.dockship{display:inline-flex;gap:0;padding:6px;border-radius:8px;touch-action:none;cursor:grab}
.dockship.v{flex-direction:column}
.dockship.sel{outline:2px solid var(--btn);background:rgba(127,127,127,.15)}
.dockship i{display:block;width:22px;height:22px;border:.5px solid var(--ink)}
.ghost{position:fixed;z-index:20;display:flex;pointer-events:none;opacity:.85}
.ghost.v{flex-direction:column}
.ghost.del{opacity:.35;filter:grayscale(1);outline:2px dashed var(--hit)}
.ghost i{display:block;width:var(--seg);height:var(--seg);border:.5px solid var(--ink)}
.grid.pl .c.s{touch-action:none}
.c.pv-ok{background:rgba(46,139,87,.55)}
.c.pv-bad{background:rgba(210,69,47,.5)}
.c.gh{opacity:.3}

/* ===== 8. Звук, зв’язок, рахунок ===== */
.top .tools{margin-left:auto;display:flex;gap:8px}
.iconbtn{width:40px;height:40px;padding:0;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:18px;display:grid;place-items:center}
.linkbar{margin:0 0 8px;padding:8px 12px;border-radius:10px;background:var(--hit);color:#fff;font-weight:600;font-size:14px}
.score{font:700 14px system-ui;letter-spacing:.08em;color:var(--mut);text-align:center;margin:-2px 0 8px}
.tip{font-size:13px;color:var(--mut);margin-top:18px;text-align:center}

/* ===== 9. Чат ===== */
.iconbtn{position:relative}
.dotbadge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--hit);color:#fff;font:700 12px system-ui;display:grid;place-items:center}
.chatback{position:fixed;inset:0;z-index:30;background:rgba(5,20,30,.45)}
.chatpanel{position:fixed;z-index:31;top:env(safe-area-inset-top,0px);left:0;right:0;margin:0 auto;max-width:460px;height:min(62vh,440px);display:flex;flex-direction:column;padding:10px 12px;background:var(--paper);border:2px solid var(--ink);border-top:0;border-radius:0 0 16px 16px}
.chathead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.chatlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.msg{display:flex}
.msg span{max-width:80%;padding:7px 11px;border-radius:14px;font-size:15px;word-break:break-word}
.msg.me{justify-content:flex-end}
.msg.me span{background:var(--btn);color:#fff;border-bottom-right-radius:4px}
.msg.op span{background:rgba(127,127,127,.22);border-bottom-left-radius:4px}
.chatrow{display:flex;gap:8px;margin-top:8px}
.chatrow input{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--ink);background:var(--sea);color:var(--ink);font-size:16px}
.chatrow button{width:48px;border:0;background:var(--btn);color:#fff;font-size:18px}

@media (prefers-reduced-motion:reduce){.enter,.overlay,.c,.c::before,.c::after{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="chat"></div>
<script>
'use strict';

/* ================================================================
   1. КОНФІГ
   ================================================================ */
const CFG = {
  fleet: { 4: 1, 3: 2, 2: 3, 1: 4 },           // розмір корабля → кількість
  n: 10,
  letters: 'АБВГДЕЖЗИК'.split(''),
  stun: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }],
  holdMs: 1100,                                // скільки показувати результат пострілу перед зміною екрана
  beatMs: 4000, deadMs: 15000, reconnectMs: 90000,   // перевірка зв’язку та час на відновлення
  animMs: 900,                                 // скільки діє анімація клітинки
};
const TOTAL_SHIPS = Object.values(CFG.fleet).reduce((a, b) => a + b, 0);
const SIZES = Object.keys(CFG.fleet).map(Number).sort((a, b) => b - a);
const MSG = {
  noServer: 'Сервер не відповідає. Якщо він щойно прокинувся, зачекай хвилину й спробуй ще.',
  lost: 'Зв’язок із суперником втрачено',
};
const ICON = {
  anchor: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V21M7 12h10M4.5 15c.6 3.4 3.8 6 7.5 6s6.9-2.6 7.5-6"/></svg>',
  ship: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16h18l-3 4H6z"/><path d="M12 3v12M12 4l6 9h-6M12 7l-5 6h5"/></svg>',
};
const $ = (sel) => document.querySelector(sel);
const esc = (t) => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Частина корпуса: носова/середня/кормова/одинарна */
const part = (j, n) => (n === 1 ? 'sg' : j === 0 ? 'sb' : j === n - 1 ? 'se' : 'sm');
const shipSegs = (n, horiz) => Array.from({ length: n }, (_, j) => `<i class="hull ${part(j, n)} ${horiz ? 'hh' : 'vv'}"></i>`).join('');

/* ================================================================
   2. СТАН
   ================================================================ */
const freshGame = () => ({
  mine: [],              // мої кораблі: [[ [r,c], ... ], ...]
  size: 4, horiz: true,  // що ставлю зараз
  meReady: false, opReady: false,
  turn: 'me',            // чий хід: 'me' | 'op'
  inShots: [],           // постріли суперника по мені
  outShots: [],          // мої постріли
  sunk: [],              // довжини потоплених кораблів суперника
  last: null,            // останній постріл (для підпису)
  lastCell: null,        // остання клітинка (для анімації)
  winner: null, opShips: null,
  target: null, waiting: false,
  holdView: null,        // тимчасово утримує екран після пострілу
  endView: 'enemy',      // що показувати після кінця гри
  fleetOpen: false,      // відкрита панель флоту суперника
  tap: null,             // останній дотик по кораблю (для подвійного дотику)
  startMsg: null,        // повідомлення про початок бою (для повтору після розриву)
  lastRes: null,         // остання відповідь на постріл (для повтору після розриву)
});
const S = { phase: 'menu', isHost: false, code: '', msg: '', draft: '', joinCode: '', link: 'up', score: { me: 0, op: 0 }, chat: { open: false, msgs: [], unread: 0, draft: '' }, ...freshGame() };
const resetGame = () => Object.assign(S, freshGame());

/* ================================================================
   2b. ЗВУК ТА ЕКРАН (звуки синтезуються, файли не потрібні)
   ================================================================ */
const Sound = {
  ctx: null,
  on: (() => { try { return localStorage.getItem('mb-sound') !== '0'; } catch { return true; } })(),
  unlock() {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!Sound.ctx && A) Sound.ctx = new A();
    if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
  },
  toggle() { Sound.on = !Sound.on; try { localStorage.setItem('mb-sound', Sound.on ? '1' : '0'); } catch {} },
  tone(freq, at, dur, { type = 'sine', vol = 0.25, to = null } = {}) {
    const c = Sound.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
  },
  noise(at, dur, { vol = 0.3, freq = 800 } = {}) {
    const c = Sound.ctx, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(c.destination); src.start(c.currentTime + at);
  },
  play(name) {
    if (!Sound.on || !Sound.ctx) return;
    const p = {
      miss: () => { Sound.noise(0, 0.35, { vol: 0.25, freq: 1200 }); Sound.tone(420, 0, 0.25, { to: 180, vol: 0.12 }); },
      hit: () => { Sound.noise(0, 0.5, { vol: 0.5, freq: 600 }); Sound.tone(150, 0, 0.4, { type: 'square', to: 40, vol: 0.3 }); },
      sunk: () => { p.hit(); [520, 390, 260].forEach((f, i) => Sound.tone(f, 0.25 + i * 0.16, 0.3, { type: 'triangle', vol: 0.22 })); },
      turn: () => { Sound.tone(660, 0, 0.12, { vol: 0.18 }); Sound.tone(880, 0.12, 0.18, { vol: 0.18 }); },
      win: () => [523, 659, 784, 1047].forEach((f, i) => Sound.tone(f, i * 0.14, 0.3, { type: 'triangle', vol: 0.25 })),
      msg: () => Sound.tone(880, 0, 0.12, { vol: 0.15 }),
      lose: () => [392, 330, 262, 196].forEach((f, i) => Sound.tone(f, i * 0.2, 0.4, { type: 'sawtooth', vol: 0.12 })),
    };
    try { p[name](); } catch {}
  },
  shot: (hit, sunk) => Sound.play(sunk ? 'sunk' : hit ? 'hit' : 'miss'),
};
const Keep = {   // не дає екрану згаснути під час гри
  lock: null,
  async on() {
    try {
      if (!navigator.wakeLock || Keep.lock) return;
      Keep.lock = await navigator.wakeLock.request('screen');
      Keep.lock.addEventListener('release', () => (Keep.lock = null));
    } catch {}
  },
};

/* ================================================================
   3. ПОЛЕ (чисті функції)
   ================================================================ */
const Board = {
  idx: (r, c) => r * CFG.n + c,
  inside: (r, c) => r >= 0 && c >= 0 && r < CFG.n && c < CFG.n,
  isHit: (shots, r, c) => shots.some(s => s.h && s.r === r && s.c === c),
  wasShot: (shots, r, c) => shots.some(s => s.r === r && s.c === c),
  shipAt: (ships, r, c) => ships.findIndex(sh => sh.some(p => p[0] === r && p[1] === c)),
  touches: (ships, r, c) => ships.some(sh => sh.some(p => Math.abs(p[0] - r) <= 1 && Math.abs(p[1] - c) <= 1)),
  isSunk: (ship, shots) => ship.every(p => Board.isHit(shots, p[0], p[1])),

  /** Класи для 100 клітинок: кораблі + постріли + анімація останньої клітинки */
  classes(ships, shots, side) {
    const a = Array(CFG.n * CFG.n).fill('');
    (ships || []).forEach(sh => sh.forEach(([r, c], j) => {
      const vert = sh.length > 1 && sh[0][1] === sh[1][1];
      a[Board.idx(r, c)] = 's hull ' + part(j, sh.length) + (vert ? ' vv' : ' hh');
    }));
    (shots || []).forEach(s => (a[Board.idx(s.r, s.c)] += s.h ? ' h' : ' m'));
    const lc = S.lastCell;
    if (lc && lc.side === side && Date.now() - lc.t < CFG.animMs) a[lc.i] += lc.h ? ' a-hit' : ' a-miss';
    return a;
  },

  /** Додає промахи навколо потопленого корабля, повертає додані клітинки */
  surround(ship, shots) {
    const added = [];
    ship.forEach(([r, c]) => {
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const a = r + dr, b = c + dc;
          if (Board.inside(a, b) && !Board.wasShot(shots, a, b)) { shots.push({ r: a, c: b, h: 0 }); added.push([a, b]); }
        }
    });
    return added;
  },
};
const Fleet = {
  left: (size) => CFG.fleet[size] - S.mine.filter(x => x.length === size).length,
  myLeft: () => S.mine.filter(sh => !Board.isSunk(sh, S.inShots)).length,
  enemyLeft: () => TOTAL_SHIPS - S.sunk.length,
};

/* ================================================================
   4. МЕРЕЖА (онлайн через сервер-посередник; запасний варіант: WebRTC вручну)
   ================================================================ */
const Net = {
  room: null, es: null, lastId: 0, n: 0, out: [], busy: false,                          // сервер-посередник
  pc: null, ch: null, cur: null, mode: null, live: false, lastSeen: 0, _beat: null,     // ручний режим

  send(o) { try { Net.ch.send(JSON.stringify(o)); } catch {} },
  reset() {
    try { Net.pc && Net.pc.close(); } catch {}
    try { Net.es && Net.es.close(); } catch {}
    clearInterval(Net._beat);
    Object.assign(Net, { room: null, es: null, lastId: 0, n: 0, out: [], busy: false, pc: null, ch: null, cur: null, mode: null, live: false });
  },

  /* ---- онлайн через сервер: код живе на сервері, тож можна виходити з гри й повертатись ---- */
  async api(path, body) {
    const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || (r.status === 404 ? 'Сервер гри не знайдено. Відкрий гру за адресою свого сервера.' : 'Помилка сервера')), { status: r.status });
    return j;
  },
  _open(j) {
    Net.reset();
    Net.room = { code: j.code, token: j.token }; Net.mode = 'relay';
    Net.ch = { send: t => { Net.out.push({ n: ++Net.n, msg: t }); Net._flush(); } };
    const es = (Net.es = new EventSource('/api/events?code=' + j.code + '&token=' + j.token));
    es.onopen = () => { if (S.link === 'down') { S.link = 'up'; UI.render(); } };
    es.onerror = () => {
      if (es.readyState === 2) return Actions.toMenu('Сесію завершено або сервер перезапустився');
      if (['place', 'battle', 'over'].includes(S.phase)) { S.link = 'down'; UI.render(); }
    };
    es.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.id <= Net.lastId) return;                 // повтор після перепідключення
      Net.lastId = m.id;
      if (m.sys === 'joined') return Game.connected();
      try { Game.onMessage(JSON.parse(m.msg)); } catch {}
    };
  },
  /** Надсилає чергу повідомлень по одному, повторюючи при збої */
  async _flush() {
    if (Net.busy) return;
    Net.busy = true;
    while (Net.out.length && Net.mode === 'relay') {
      const item = Net.out[0];
      try { await Net.api('send', { ...Net.room, n: item.n, msg: item.msg }); Net.out.shift(); }
      catch (e) {
        if (e.status === 404) { Net.busy = false; return Actions.toMenu('Сесію завершено'); }
        await new Promise(r => setTimeout(r, 1500));
      }
    }
    Net.busy = false;
  },
  async host() {
    try {
      S.isHost = true;
      UI.flash('Створюємо сесію…');
      const j = await Net.api('create', {});
      Net._open(j);
      S.code = j.code; UI.go('hostWait');
    } catch (e) { UI.flash(e.status ? e.message : MSG.noServer); }
  },
  async join(code) {
    code = (code || '').trim();
    S.joinCode = code;
    if (!/^\d{4}$/.test(code)) return UI.flash('Введи 4 цифри коду');
    try {
      S.isHost = false;
      UI.flash('Підключаємось…');
      Net._open(await Net.api('join', { code }));
      Game.connected();
    } catch (e) { UI.flash(e.status ? e.message : MSG.noServer); }
  },

  /* ---- перевірка зв’язку (лише ручний режим) ---- */
  startBeat() {
    clearInterval(Net._beat);
    Net._beat = setInterval(() => {
      if (!Net.live) return;
      Net.send({ t: 'ping' });
      if (Date.now() - Net.lastSeen > CFG.deadMs) Net.down(Net.cur);
    }, CFG.beatMs);
  },
  down(c) {
    if (c && Net.cur && c !== Net.cur) return;
    Net.live = false;
    if (S.phase !== 'menu') Actions.toMenu(MSG.lost);
  },

  /* ---- запасний варіант: обмін довгими кодами ---- */
  async encode(o) {
    const s = JSON.stringify(o);
    if (window.CompressionStream) {
      const st = new Blob([s]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z' + btoa(String.fromCharCode(...new Uint8Array(await new Response(st).arrayBuffer())));
    }
    return 'p' + btoa(unescape(encodeURIComponent(s)));
  },
  async decode(t) {
    t = t.replace(/\s/g, '');
    if (t[0] === 'z') {
      const bytes = Uint8Array.from(atob(t.slice(1)), c => c.charCodeAt(0));
      const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return JSON.parse(await new Response(st).text());
    }
    return JSON.parse(decodeURIComponent(escape(atob(t.slice(1)))));
  },
  _rtc() {
    const R = window.RTCPeerConnection || window.webkitRTCPeerConnection;
    if (!R) throw new Error('тут вимкнено пряме з’єднання. Відкрий сторінку в Safari');
    Net.pc = new R({ iceServers: CFG.stun });
  },
  _gathered() {
    return new Promise(res => {
      if (Net.pc.iceGatheringState === 'complete') return res();
      Net.pc.onicegatheringstatechange = () => Net.pc.iceGatheringState === 'complete' && res();
      setTimeout(res, 4000);
    });
  },
  _wireChannel(ch) {
    Net.ch = Net.cur = ch; Net.mode = 'manual';
    ch.onopen = Game.connected;
    ch.onmessage = e => { Net.lastSeen = Date.now(); Game.onMessage(JSON.parse(e.data)); };
    ch.onclose = () => Net.down(ch);
  },
  async manualHost() {
    Net._rtc();
    Net._wireChannel(Net.pc.createDataChannel('g'));
    await Net.pc.setLocalDescription(await Net.pc.createOffer());
    await Net._gathered();
    return Net.encode(Net.pc.localDescription);
  },
  async manualFinish(text) { await Net.pc.setRemoteDescription(await Net.decode(text)); },
  async manualGuest(text) {
    Net._rtc();
    Net.pc.ondatachannel = e => Net._wireChannel(e.channel);
    await Net.pc.setRemoteDescription(await Net.decode(text));
    await Net.pc.setLocalDescription(await Net.pc.createAnswer());
    await Net._gathered();
    return Net.encode(Net.pc.localDescription);
  },
};

/* ================================================================
   5. ЛОГІКА ГРИ
   ================================================================ */
const Game = {
  connected() {
    Net.live = true; Net.lastSeen = Date.now(); if (Net.mode === 'manual') Net.startBeat(); Keep.on();
    if (['place', 'battle', 'over'].includes(S.phase)) { S.link = 'up'; Game.resync(); }   // зв’язок відновлено
    else S.phase = 'place';
    UI.render();
  },
  /** Після відновлення зв’язку повторює те, що могло загубитися */
  resync() {
    if (S.meReady) Net.send({ t: 'ready' });
    if (S.isHost && S.startMsg) Net.send(S.startMsg);
    if (S.waiting && S.target !== null) Game.fire();
    if (S.phase === 'over' && S.winner === 'me') Net.send({ t: 'reveal', ships: S.mine });
  },

  /** Усі повідомлення від суперника */
  onMessage(m) {
    const handlers = {
      ready: () => { S.opReady = true; Game.tryStart(); },
      start: () => { if (S.phase !== 'place') return; S.turn = m.guestFirst ? 'me' : 'op'; S.phase = 'battle'; if (S.turn === 'me') Sound.play('turn'); },
      shot: () => Game.receiveShot(m.r, m.c),
      res: () => Game.receiveResult(m),
      reveal: () => { S.opShips = m.ships; },
      again: () => { resetGame(); S.phase = 'place'; },
      unready: () => {   // гість просить хоста скасувати готовність, а хост лише повідомляє гостя
        if (!S.isHost) S.opReady = false;
        else if (S.phase === 'place') { S.opReady = false; Net.send({ t: 'unready-ok' }); }
      },
      'unready-ok': () => { S.meReady = false; },
      chat: () => Game.receiveChat(m.text),
    };
    if (handlers[m.t]) { handlers[m.t](); UI.render(); }
  },

  /* ---- розстановка ---- */
  place(i) {
    const r = Math.floor(i / CFG.n), c = i % CFG.n, k = Board.shipAt(S.mine, r, c);
    if (k >= 0) {                                   // дотик по кораблю: подвійний повертає його
      if (S.tap && S.tap.k === k && Date.now() - S.tap.t < 400) { S.tap = null; return Game.rotate(k); }
      S.tap = { k, t: Date.now() };
      return null;
    }
    if (Fleet.left(S.size) < 1) return 'Кораблі цього розміру вже розставлені';
    const cells = Array.from({ length: S.size }, (_, j) => (S.horiz ? [r, c + j] : [r + j, c]));
    if (!Game.canPlace(cells)) return 'Тут не можна: корабель виходить за поле або торкається іншого';
    S.mine.push(cells);
    S.size = SIZES.find(s => Fleet.left(s) > 0) || S.size;
    return null;
  },
  /** Повертає корабель на 90°, при потребі зсуваючи його від краю */
  rotate(k) {
    const ship = S.mine[k], n = ship.length;
    if (n < 2) return null;
    const vert = ship[0][1] === ship[1][1], [r0, c0] = ship[0];
    for (let off = 0; off < n; off++) {
      const r = vert ? r0 : r0 - off, c = vert ? c0 - off : c0;
      const cells = Array.from({ length: n }, (_, j) => (vert ? [r, c + j] : [r + j, c]));
      if (Game.canPlace(cells, k)) { S.mine[k] = cells; return null; }
    }
    return 'Не вистачає місця, щоб повернути корабель';
  },
  /** Скасувати готовність, поки суперник ще не готовий */
  unready() {
    if (S.phase !== 'place' || !S.meReady) return;
    if (S.isHost) S.meReady = false;                // хост вирішує сам
    Net.send({ t: 'unready' });                     // гість чекає підтвердження від хоста
  },
  /* ---- чат ---- */
  receiveChat(text) {
    S.chat.msgs.push({ from: 'op', text: String(text).slice(0, 300) });
    if (S.chat.msgs.length > 100) S.chat.msgs.shift();
    if (!S.chat.open) { S.chat.unread++; Sound.play('msg'); }
  },
  sendChat() {
    const text = (S.chat.draft || '').trim().slice(0, 300);
    if (!text) return;
    S.chat.msgs.push({ from: 'me', text });
    S.chat.draft = '';
    Net.send({ t: 'chat', text });
  },
  canPlace(cells, ignore = -1) {
    const others = S.mine.filter((_, i) => i !== ignore);
    return cells.every(([a, b]) => Board.inside(a, b) && !Board.touches(others, a, b));
  },
  /** Випадкова розстановка всього флоту */
  randomize() {
    const sizes = SIZES.flatMap(sz => Array(CFG.fleet[sz]).fill(sz)), rnd = () => Math.floor(Math.random() * CFG.n);
    for (let attempt = 0; attempt < 60; attempt++) {
      const ships = [];
      const ok = sizes.every(size => {
        for (let k = 0; k < 200; k++) {
          const horiz = Math.random() < 0.5, r = rnd(), c = rnd();
          const cells = Array.from({ length: size }, (_, j) => (horiz ? [r, c + j] : [r + j, c]));
          if (cells.every(([a, b]) => Board.inside(a, b) && !Board.touches(ships, a, b))) { ships.push(cells); return true; }
        }
        return false;
      });
      if (ok) { S.mine = ships; return; }
    }
  },
  ready() { S.meReady = true; Net.send({ t: 'ready' }); Game.tryStart(); },
  tryStart() {
    if (S.isHost && S.meReady && S.opReady && S.phase === 'place') {
      const guestFirst = Math.random() < 0.5;
      S.turn = guestFirst ? 'op' : 'me';
      S.phase = 'battle';
      S.startMsg = { t: 'start', guestFirst };
      Net.send(S.startMsg);
      if (S.turn === 'me') Sound.play('turn');
    }
  },

  /* ---- бій ---- */
  aim(i) {
    if (S.turn !== 'me' || S.holdView || S.waiting || Board.wasShot(S.outShots, Math.floor(i / CFG.n), i % CFG.n)) return;
    S.target = i;
  },
  fire() {
    S.waiting = true;
    Net.send({ t: 'shot', r: Math.floor(S.target / CFG.n), c: S.target % CFG.n });
  },
  /** Суперник стріляє по мені */
  receiveShot(r, c) {
    if (Board.wasShot(S.inShots, r, c)) {             // повтор після відновлення зв’язку
      if (S.lastRes && S.lastRes.r === r && S.lastRes.c === c) Net.send(S.lastRes);
      return;
    }
    const ship = S.mine[Board.shipAt(S.mine, r, c)];
    S.inShots.push({ r, c, h: ship ? 1 : 0 });
    let len = 0, auto = [], win = false;
    if (ship) {
      if (Board.isSunk(ship, S.inShots)) { len = ship.length; auto = Board.surround(ship, S.inShots); }
      win = S.mine.every(sh => Board.isSunk(sh, S.inShots));
    } else S.turn = 'me';
    S.last = { by: 'op', h: ship ? 1 : 0, s: len ? 1 : 0 };
    S.lastCell = { side: 'own', i: Board.idx(r, c), h: ship ? 1 : 0, t: Date.now() };
    S.lastRes = { t: 'res', r, c, h: ship ? 1 : 0, s: len ? 1 : 0, len, auto, win, ships: win ? S.mine : null };
    Net.send(S.lastRes);
    Sound.shot(ship ? 1 : 0, len);
    if (win) { S.phase = 'over'; S.winner = 'op'; S.endView = 'own'; S.score.op++; setTimeout(() => Sound.play('lose'), 700); }
    else if (!ship) { Game.hold('own'); setTimeout(() => Sound.play('turn'), 650); }
  },
  /** Відповідь на мій постріл */
  receiveResult(m) {
    if (Board.wasShot(S.outShots, m.r, m.c)) return;   // повтор після відновлення зв’язку
    S.outShots.push({ r: m.r, c: m.c, h: m.h });
    m.auto.forEach(([a, b]) => S.outShots.push({ r: a, c: b, h: 0 }));
    if (m.s) S.sunk.push(m.len);
    if (!m.h) S.turn = 'op';
    S.last = { by: 'me', h: m.h, s: m.s };
    S.lastCell = { side: 'enemy', i: Board.idx(m.r, m.c), h: m.h, t: Date.now() };
    S.waiting = false; S.target = null;
    Sound.shot(m.h, m.s);
    if (m.win) {
      S.phase = 'over'; S.winner = 'me'; S.opShips = m.ships; S.endView = 'enemy'; S.score.me++;
      Net.send({ t: 'reveal', ships: S.mine });
      setTimeout(() => Sound.play('win'), 700);
    } else if (!m.h) Game.hold('enemy');
  },
  /** Утримує екран на секунду, щоб було видно анімацію пострілу */
  hold(view) {
    S.holdView = view;
    clearTimeout(Game._t);
    Game._t = setTimeout(() => { S.holdView = null; UI.render(); }, CFG.holdMs);
  },
  again() { Net.send({ t: 'again' }); resetGame(); S.phase = 'place'; },
};

/* ================================================================
   5b. ПЕРЕТЯГУВАННЯ КОРАБЛІВ (під час розстановки)
   ================================================================ */
const Drag = {
  st: null, active: false, justDragged: 0, OFFSET: 46, SLOP: 8,

  begin(e, info) {   // info: { size, horiz, from: 'dock' | 'grid', k }
    Drag.st = { ...info, x0: e.clientX, y0: e.clientY, id: e.pointerId, moved: false, ghost: null, seg: 24 };
    Drag.active = true;
    document.addEventListener('pointermove', Drag.move);
    document.addEventListener('pointerup', Drag.end);
    document.addEventListener('pointercancel', Drag.end);
  },
  cell: (i) => document.querySelector('.grid .c[data-i="' + i + '"]'),
  /** Індекс клітинки під пальцем (з відступом, щоб палець не закривав корабель) */
  at(e) {
    const el = document.elementFromPoint(e.clientX, e.clientY - Drag.OFFSET), c = el && el.closest('.c[data-i]');
    return c ? +c.dataset.i : null;
  },
  shape(i, st) {
    const r = Math.floor(i / CFG.n), c = i % CFG.n;
    return Array.from({ length: st.size }, (_, j) => (st.horiz ? [r, c + j] : [r + j, c]));
  },
  makeGhost() {
    const st = Drag.st, c0 = document.querySelector('.grid .c'), g = document.createElement('div');
    st.seg = c0 ? c0.offsetWidth : 24;
    g.className = 'ghost' + (st.horiz ? '' : ' v');
    g.style.setProperty('--seg', st.seg + 'px');
    g.innerHTML = shipSegs(st.size, st.horiz);
    document.body.appendChild(g);
    st.ghost = g;
  },
  clearMarks() { document.querySelectorAll('.pv-ok,.pv-bad,.gh').forEach(el => el.classList.remove('pv-ok', 'pv-bad', 'gh')); },
  move(e) {
    const st = Drag.st;
    if (!st || e.pointerId !== st.id) return;
    if (!st.moved) {
      if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < Drag.SLOP) return;
      st.moved = true; Drag.makeGhost();
    }
    e.preventDefault();
    st.ghost.style.left = e.clientX - st.seg / 2 + 'px';
    st.ghost.style.top = e.clientY - Drag.OFFSET - st.seg / 2 + 'px';
    Drag.clearMarks();
    if (st.from === 'grid') S.mine[st.k].forEach(([r, c]) => { const el = Drag.cell(Board.idx(r, c)); el && el.classList.add('gh'); });
    const i = Drag.at(e);
    st.ghost.classList.toggle('del', st.from === 'grid' && i === null);   // за межами поля: буде прибрано
    if (i === null) return;
    const cells = Drag.shape(i, st), ok = Game.canPlace(cells, st.from === 'grid' ? st.k : -1);
    cells.forEach(([r, c]) => { if (Board.inside(r, c)) Drag.cell(Board.idx(r, c)).classList.add(ok ? 'pv-ok' : 'pv-bad'); });
  },
  end(e) {
    const st = Drag.st;
    if (!st || e.pointerId !== st.id) return;
    ['pointermove', 'pointerup', 'pointercancel'].forEach((n, k) => document.removeEventListener(n, [Drag.move, Drag.end, Drag.end][k]));
    Drag.st = null; Drag.active = false;
    if (st.ghost) st.ghost.remove();
    Drag.clearMarks();
    if (st.moved) {
      Drag.justDragged = Date.now();
      const up = e.type === 'pointerup', i = up ? Drag.at(e) : null;
      if (st.from === 'grid' && up && i === null) { S.mine.splice(st.k, 1); S.size = st.size; }   // кинули за межі поля: прибрати
      else if (i !== null) {
        const cells = Drag.shape(i, st);
        if (Game.canPlace(cells, st.from === 'grid' ? st.k : -1)) {
          if (st.from === 'grid') S.mine.splice(st.k, 1);
          S.mine.push(cells);
          S.size = SIZES.find(s => Fleet.left(s) > 0) || S.size;
        }
      }
    } else if (st.from === 'dock') {          // короткий дотик: вибрати або повернути
      if (S.size === st.size) S.horiz = !S.horiz; else S.size = st.size;
    }
    UI.render();
  },
};

/* ================================================================
   6. ІНТЕРФЕЙС
   ================================================================ */
const UI = {
  lastPhase: null,
  go(phase) { S.phase = phase; S.draft = ''; UI.render(); },
  flash(text) { S.msg = text; UI.render(); },

  /** Чат живе окремо від решти екрана, щоб не збивати клавіатуру під час набору */
  renderChat() {
    const box = $('#chat'), c = S.chat;
    if (!box) return;
    if (!c.open) { box.innerHTML = ''; return; }
    if (!box.firstChild)
      box.innerHTML = `<div class="chatback" data-act="closeChat"></div><div class="chatpanel">
        <div class="chathead"><b>Чат</b><button class="iconbtn" data-act="closeChat" aria-label="Закрити">✕</button></div>
        <div class="chatlist" id="chatlist"></div>
        <div class="chatrow"><input id="chatin" maxlength="300" placeholder="Повідомлення…" autocomplete="off"><button data-act="chatSend" aria-label="Надіслати">➤</button></div></div>`;
    const list = $('#chatlist');
    list.innerHTML = c.msgs.map(m => `<div class="msg ${m.from}"><span>${esc(m.text)}</span></div>`).join('') || '<p class="mut" style="text-align:center">Напиши першим 👋</p>';
    list.scrollTop = list.scrollHeight;
  },

  render() {
    if (Drag.active) return;            // не перебудовуємо екран під час перетягування
    const inp = $('#in'), cd = $('#cd');
    if (inp) S.draft = inp.value;
    if (cd) S.joinCode = cd.value;
    const msg = S.msg; S.msg = '';
    const enter = UI.lastPhase !== S.phase; UI.lastPhase = S.phase;
    $('#app').innerHTML =
      UI.top() + (S.link === 'down' ? '<div class="linkbar">Зв’язок втрачено. Відновлюємо…</div>' : '') +
      `<main class="${enter ? 'enter' : ''}">${Views[S.phase]()}<p class="err">${msg}</p></main>` +
      (S.fleetOpen ? UI.fleetSheet() : '');
    UI.renderChat();
  },

  /* ---- дрібні компоненти ---- */
  top: () => `<header class="top">${ICON.anchor}<h1>Морський бій</h1><div class="tools">` +
    (['place', 'battle', 'over'].includes(S.phase) ? `<button class="iconbtn" data-act="chat" aria-label="Чат">💬${S.chat.unread ? `<span class="dotbadge">${S.chat.unread}</span>` : ''}</button>` : '') +
    `<button class="iconbtn" data-act="sound" aria-label="Звук">${Sound.on ? '🔊' : '🔇'}</button></div></header>`,
  opStatus: () => `<div class="status${S.opReady ? ' ok' : ''}">Суперник: ${S.opReady ? 'готовий ✓' : 'розставляє кораблі…'}</div>`,
  pills: () => `<div class="pills"><span>Мій флот <b>${Fleet.myLeft()}</b>/${TOTAL_SHIPS}</span><span>Суперник <b>${Fleet.enemyLeft()}</b>/${TOTAL_SHIPS}</span></div>` + (S.score.me + S.score.op ? `<div class="score">Рахунок ${S.score.me} : ${S.score.op}</div>` : ''),
  head: (title, withFleet) =>
    `<div class="bhead"><span class="lbl">${title}</span>` +
    (withFleet ? `<button class="fleetbtn" data-act="fleet" aria-label="Флот суперника">${ICON.ship}<span class="badge">${Fleet.enemyLeft()}</span></button>` : '') +
    '</div>',
  card(cls, act) {
    const cells = cls.map((c, i) => `<div class="c ${c}"${act ? ` data-act="${act}" data-i="${i}"` : ''}></div>`).join('');
    const cols = CFG.letters.map(l => `<b>${l}</b>`).join('');
    const rows = Array.from({ length: CFG.n }, (_, i) => `<b>${i + 1}</b>`).join('');
    return `<div class="card"><div class="board"><span></span><div class="cols">${cols}</div><div class="rows">${rows}</div><div class="grid${act === 'place' ? ' pl' : ''}">${cells}</div></div></div>`;
  },
  lastMsg() {
    const l = S.last;
    if (!l) return '';
    return `<p class="last${l.h ? ' hit' : ''}"><b>${l.by === 'me' ? 'Ти' : 'Суперник'}:</b> ${l.s ? 'потоплено!' : l.h ? 'влучання!' : 'мимо'}</p>`;
  },
  codeBox: () =>
    `<textarea id="out" readonly onclick="this.select()">${S.code}</textarea>
     <button class="b" data-act="share">Надіслати код</button><button class="b sec" data-act="copy">Скопіювати код</button>`,

  /** Панель зі станом флоту суперника: закривається дотиком будь-де */
  fleetSheet() {
    const rows = SIZES.map(size => {
      const total = CFG.fleet[size], dead = S.sunk.filter(l => l === size).length;
      const ships = Array.from({ length: total }, (_, k) => `<span class="seg${k < dead ? ' dead' : ''}">${shipSegs(size, true)}</span>`).join('');
      return `<div class="frow"><span class="fname">${size}-палубний</span><span class="ships">${ships}</span></div>`;
    }).join('');
    return `<div class="overlay" data-act="closeFleet"><div class="sheet"><h2>Флот суперника</h2>
      <p class="mut">Залишилось ${Fleet.enemyLeft()} з ${TOTAL_SHIPS}</p>${rows}<p class="hint">Торкнись будь-де, щоб закрити</p></div></div>`;
  },
};

/* ---- екрани: ключ збігається зі значенням S.phase ---- */
const Views = {
  menu: () => `<p class="mut">Грають двоє. Достатньо назвати другові короткий код.</p>
    <button class="b" data-act="host">Створити сесію</button>
    <button class="b sec" data-act="goJoin">Підключитися до сесії</button>
    <p style="text-align:center;margin-top:22px"><a href="#" class="link" data-act="goManual">Не виходить? З’єднатися вручну</a></p>${navigator.standalone === false ? '<p class="tip">Порада: у Safari натисни «Поділитися» → «На екран “Додому”», і гра відкриватиметься як застосунок.</p>' : ''}`,

  hostWait: () => `<h2>Сесія створена</h2>
    <p class="mut">Назви цей код другому гравцю. Він має відкрити цю ж сторінку й обрати «Підключитися до сесії».</p>
    <div class="code">${S.code}</div><p class="mut" style="text-align:center">Чекаємо на підключення…<br>Можеш спокійно перейти в месенджер: код чекатиме на сервері.</p>
    <button class="b" data-act="shareCode">Надіслати код другові</button>
    <button class="b sec" data-act="toMenu">Скасувати</button>`,

  guestCode: () => `<h2>Введи код сесії</h2><p class="mut">Його має назвати той, хто створив сесію.</p>
    <input id="cd" class="codein" inputmode="numeric" maxlength="4" placeholder="0000" value="${S.joinCode}">
    <button class="b" data-act="join">Підключитися</button><button class="b sec" data-act="toMenu">Назад</button>`,

  manual: () => `<h2>З’єднання вручну</h2>
    <p class="mut">Без короткого коду: ви обмінюєтесь довгими кодами в месенджері. Підходить, якщо звичайний спосіб не спрацював.</p>
    <button class="b" data-act="manualHost">Створити сесію вручну</button>
    <button class="b sec" data-act="goManualJoin">Підключитися вручну</button><button class="b sec" data-act="toMenu">Назад</button>`,

  hostA: () => `<h2>1. Надішли цей код другому гравцю</h2>
    <p class="mut">У месенджері або SMS. Він має відкрити цю ж сторінку й обрати «З’єднатися вручну».</p>${UI.codeBox()}
    <h2>2. Встав його відповідь</h2><textarea id="in" placeholder="Код відповіді">${S.draft}</textarea>
    <button class="b" data-act="manualFinish">З’єднати</button><button class="b sec" data-act="toMenu">Скасувати</button>`,

  guestA: () => `<h2>Встав код сесії від хоста</h2><textarea id="in" placeholder="Код сесії">${S.draft}</textarea>
    <button class="b" data-act="manualGuest">Далі</button><button class="b sec" data-act="toMenu">Назад</button>`,

  guestB: () => `<h2>Надішли цей код хосту</h2><p class="mut">Коли хост вставить його, гра почнеться сама.</p>${UI.codeBox()}
    <button class="b sec" data-act="toMenu">Скасувати</button>`,

  place() {
    if (S.meReady)
      return `<h2>Флот готовий</h2>${UI.opStatus()}${UI.card(Board.classes(S.mine, [], 'own'))}
        <button class="b sec" data-act="unready">Скасувати готовність</button>`;
    const dock = SIZES.filter(sz => Fleet.left(sz) > 0).map(sz =>
      `<div class="dockitem"><div class="dockship${S.horiz ? '' : ' v'}${S.size === sz ? ' sel' : ''}" data-dock="${sz}">${shipSegs(sz, S.horiz)}</div><small>×${Fleet.left(sz)}</small></div>`).join('');
    return `<h2>Розстав кораблі</h2>${UI.opStatus()}
      <p class="mut">Перетягни корабель із панелі на поле. Подвійний дотик по кораблю повертає його, а щоб прибрати, перетягни його за межі поля. Кораблі не торкаються, навіть кутами.</p>
      ${UI.head('Твоє поле')}${UI.card(Board.classes(S.mine, [], 'own'), 'place')}
      <div class="dock">${dock || '<span class="mut">Усі кораблі розставлено</span>'}</div>
      <div class="bar"><button class="chip" data-act="rotate">Повернути</button><button class="chip" data-act="random">Випадково</button><button class="chip" data-act="clear">Очистити</button></div>
      <button class="b" data-act="ready" ${S.mine.length < TOTAL_SHIPS ? 'disabled' : ''}>Готово (${S.mine.length}/${TOTAL_SHIPS})</button>`;
  },

  battle() {
    const my = S.turn === 'me';
    const enemy = S.holdView ? S.holdView === 'enemy' : my;
    const text = my ? (enemy ? 'Твій хід — обери клітинку на полі суперника' : 'Твій хід…') : 'Хід суперника…';
    const top = `${UI.pills()}<div class="status${my ? ' you' : ''}">${text}</div>${UI.lastMsg()}`;
    if (!enemy) return top + UI.head('Твоє поле') + UI.card(Board.classes(S.mine, S.inShots, 'own'));
    const cls = Board.classes(null, S.outShots, 'enemy');
    if (S.target !== null) cls[S.target] += S.waiting ? ' t w' : ' t';
    return top + UI.head('Поле суперника', true) + UI.card(cls, 'aim') +
      `<button class="b" data-act="fire" ${S.target === null || S.waiting || !my ? 'disabled' : ''}>Вогонь!</button>`;
  },

  over() {
    const won = S.winner === 'me', own = S.endView === 'own';
    const cls = own ? Board.classes(S.mine, S.inShots, 'own') : Board.classes(S.opShips, S.outShots, 'enemy');
    return `<div class="banner ${won ? 'win' : 'lose'}"><h2>${won ? 'Перемога!' : 'Поразка'}</h2>
      <p class="mut">${won ? 'Ти потопив увесь флот суперника.' : 'Суперник потопив увесь твій флот.'}</p></div>
      ${UI.pills()}
      <div class="bar"><button class="chip${own ? '' : ' on'}" data-act="view" data-v="enemy">Поле суперника</button><button class="chip${own ? ' on' : ''}" data-act="view" data-v="own">Моє поле</button></div>
      ${UI.head(own ? 'Твоє поле' : 'Поле суперника', !own)}${UI.card(cls)}
      <button class="b" data-act="again">Грати ще</button>`;
  },
};

/* ================================================================
   7. ДІЇ (кнопки з data-act)
   ================================================================ */
const Actions = {
  /* навігація */
  toMenu(msg) { Net.reset(); Object.assign(S, freshGame(), { phase: 'menu', code: '', draft: '', link: 'up', score: { me: 0, op: 0 }, chat: { open: false, msgs: [], unread: 0, draft: '' }, msg: typeof msg === 'string' ? msg : '' }); UI.render(); },
  goJoin: () => UI.go('guestCode'),
  goManual: () => UI.go('manual'),
  goManualJoin: () => UI.go('guestA'),

  /* з’єднання */
  host: () => Net.host(),
  join: () => Net.join($('#cd').value),
  async manualHost() {
    try { S.isHost = true; S.code = await Net.manualHost(); UI.go('hostA'); }
    catch (e) { UI.flash('Не вдалося створити сесію: ' + e.message); }
  },
  async manualFinish() {
    try { await Net.manualFinish($('#in').value); UI.flash('З’єднуємось…'); }
    catch { UI.flash('Код відповіді неправильний'); }
  },
  async manualGuest() {
    try { S.isHost = false; S.code = await Net.manualGuest($('#in').value); UI.go('guestB'); }
    catch { UI.flash('Код сесії неправильний'); }
  },
  async copy() {
    $('#out').select();
    try { await navigator.clipboard.writeText(S.code); UI.flash('Скопійовано'); } catch { UI.flash('Затисни текст і скопіюй вручну'); }
  },
  /** Надсилає код і посилання через меню «Поділитися» (не виходячи зі сторінки) */
  shareCode() {
    const text = 'Грай зі мною в Морський бій! Код сесії: ' + S.code + '. Відкрий у Safari: ' + location.href.split(/[?#]/)[0];
    if (navigator.share) return navigator.share({ text }).catch(() => {});
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => UI.flash('Повідомлення скопійовано, встав його другові'))
      .catch(() => UI.flash('Назви другові код: ' + S.code));
  },
  share() { navigator.share ? navigator.share({ text: S.code }).catch(() => {}) : Actions.copy(); },

  /* розстановка */
  sound() { Sound.toggle(); UI.render(); },
  unready() { Game.unready(); UI.render(); },
  chat() { S.chat.open = true; S.chat.unread = 0; UI.render(); const i = $('#chatin'); if (i) i.focus(); },
  closeChat() { S.chat.open = false; UI.render(); },
  chatSend() { const i = $('#chatin'); S.chat.draft = i ? i.value : ''; Game.sendChat(); if (i) i.value = ''; UI.renderChat(); },
  random() { Game.randomize(); S.size = SIZES.find(s => Fleet.left(s) > 0) || S.size; UI.render(); },
  rotate() { S.horiz = !S.horiz; UI.render(); },
  clear() { S.mine = []; S.size = SIZES[0]; UI.render(); },
  place(d) { if (Date.now() - Drag.justDragged < 400) return; const err = Game.place(+d.i); if (err) S.msg = err; UI.render(); },
  ready() { Game.ready(); UI.render(); },

  /* бій */
  aim(d) { if (Date.now() - Drag.justDragged < 400) return; Game.aim(+d.i); UI.render(); },
  fire() { Game.fire(); UI.render(); },
  fleet() { S.fleetOpen = true; UI.render(); },
  closeFleet() { S.fleetOpen = false; UI.render(); },
  view(d) { S.endView = d.v; UI.render(); },
  again() { Game.again(); UI.render(); },
};

/* Один обробник кліків на всю сторінку */
document.addEventListener('click', e => {
  Sound.unlock();
  const el = e.target.closest('[data-act]');
  const fn = el && Actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset); }
});

/* Перетягування: починаємо з панелі кораблів або з уже поставленого корабля */
document.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (S.phase !== 'place' || S.meReady || S.fleetOpen) return;
  const dock = e.target.closest('[data-dock]');
  if (dock) return Drag.begin(e, { size: +dock.dataset.dock, horiz: S.horiz, from: 'dock' });
  const cell = e.target.closest('.grid.pl .c.s');
  if (!cell) return;
  const i = +cell.dataset.i, k = Board.shipAt(S.mine, Math.floor(i / CFG.n), i % CFG.n);
  if (k >= 0) {
    const sh = S.mine[k];
    Drag.begin(e, { size: sh.length, horiz: sh.length < 2 || sh[0][0] === sh[1][0], from: 'grid', k });
  }
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ['place', 'battle', 'over'].includes(S.phase)) Keep.on();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'chatin') { e.preventDefault(); Actions.chatSend(); }
});

UI.render();
</script>
</body>
</html>
