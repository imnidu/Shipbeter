<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Морський бій</title>
<style>
:root{--paper:#dce8e6;--ink:#12303f;--sea:#c3dbe0;--grid:#93b5bd;--hit:#d2452f;--btn:#0f5c6e;--mut:#4d6b78;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f2230;--ink:#dce8e6;--sea:#17394a;--grid:#2c5a6c;--btn:#2a8aa0;--mut:#9fbac4;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f2230;--ink:#dce8e6;--sea:#17394a;--grid:#2c5a6c;--btn:#2a8aa0;--mut:#9fbac4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
#app{max-width:460px;margin:0 auto;padding:16px 14px 20px}
h1{font:italic 700 30px Georgia,serif;margin:12px 0 18px}
h2{font:700 20px system-ui;margin:6px 0 4px}
p{margin:6px 0}.mut{color:var(--mut)}
button,textarea{font:inherit;border-radius:10px}
.b{display:block;width:100%;padding:14px;border:0;background:var(--btn);color:#fff;font-weight:600;margin:10px 0}
.b.sec{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.b:disabled{opacity:.4}
textarea{width:100%;height:110px;padding:10px;border:2px solid var(--ink);background:var(--sea);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,monospace;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(10,1fr);border:2px solid var(--ink);background:var(--sea);margin:10px 0}
.c{aspect-ratio:1;border:.5px solid var(--grid);position:relative}
.c.s{background:var(--ink)}
.c.m::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--ink);opacity:.55}
.c.h::before,.c.h::after{content:"";position:absolute;left:12%;right:12%;top:47%;height:6%;min-height:2px;background:var(--hit)}
.c.h::before{transform:rotate(45deg)}.c.h::after{transform:rotate(-45deg)}
.c.s.h{background:#5a2a24}
.c.t{outline:3px solid var(--hit);outline-offset:-3px;z-index:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{flex:1;min-width:64px;padding:10px 6px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600}
.chip.on{background:var(--ink);color:var(--paper)}.chip:disabled{opacity:.35}
.err{color:var(--hit);min-height:22px;font-weight:600}
.status{padding:10px 12px;border-left:5px solid var(--btn);background:rgba(127,127,127,.15);margin:8px 0;font-weight:600}
.status.you{border-color:var(--hit)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const FLEET={4:1,3:2,2:3,1:4};
const $=s=>document.querySelector(s);
let phase='menu',isHost=false,pc=null,dc=null,code='',msg='';
let mine=[],size=4,horiz=true,meReady=false,opReady=false,turn='me';
let inShots=[],outShots=[],last=null,winner=null,opShips=null,target=null,waiting=false;

/* ---------- з’єднання без сервера ---------- */
const b64=u=>btoa(String.fromCharCode(...u)), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function enc(o){
  const s=JSON.stringify(o);
  if(window.CompressionStream){
    const st=new Blob([s]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 'z'+b64(new Uint8Array(await new Response(st).arrayBuffer()));
  }
  return 'p'+btoa(unescape(encodeURIComponent(s)));
}
async function dec(t){
  t=t.replace(/\s/g,'');
  if(t[0]==='z'){
    const st=new Blob([unb64(t.slice(1))]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(st).text());
  }
  return JSON.parse(decodeURIComponent(escape(atob(t.slice(1)))));
}
function mk(){
  const RTC=window.RTCPeerConnection||window.webkitRTCPeerConnection;
  if(!RTC)throw new Error('тут вимкнено пряме з’єднання. Відкрий це посилання в Safari, а не всередині застосунку');
  pc=new RTC({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]}); // Wi-Fi і інтернет
}
function gathered(){
  return new Promise(r=>{
    if(pc.iceGatheringState==='complete')return r();
    pc.onicegatheringstatechange=()=>pc.iceGatheringState==='complete'&&r();
    setTimeout(r,4000);
  });
}
function wire(ch){
  dc=ch;
  ch.onopen=()=>{phase='place';render()};
  ch.onmessage=e=>handle(JSON.parse(e.data));
  ch.onclose=()=>{if(phase!=='menu'){toMenu('Зв’язок із суперником втрачено')}};
}
const send=o=>{try{dc.send(JSON.stringify(o))}catch{}};
function toMenu(m){
  try{pc&&pc.close()}catch{}
  pc=dc=null;phase='menu';code='';resetGame();phase='menu';msg=m||'';render();
}
async function hostStart(){
  try{
    isHost=true;mk();wire(pc.createDataChannel('g'));
    await pc.setLocalDescription(await pc.createOffer());await gathered();
    code=await enc(pc.localDescription);phase='hostA';render();
  }catch(e){flash('Не вдалося створити сесію: '+e.message)}
}
async function hostFinish(){
  try{await pc.setRemoteDescription(await dec($('#in').value));flash('З’єднуємось…')}
  catch(e){flash('Код відповіді неправильний')}
}
async function guestStart(){
  try{
    isHost=false;mk();pc.ondatachannel=e=>wire(e.channel);
    await pc.setRemoteDescription(await dec($('#in').value));
    await pc.setLocalDescription(await pc.createAnswer());await gathered();
    code=await enc(pc.localDescription);phase='guestB';render();
  }catch(e){flash('Код сесії неправильний')}
}
async function copy(){
  const t=$('#out');t.select();
  try{await navigator.clipboard.writeText(code);flash('Скопійовано')}catch{flash('Затисни текст і скопіюй вручну')}
}
function share(){navigator.share?navigator.share({text:code}).catch(()=>{}):copy()}
function flash(t){msg=t;render()}

/* ---------- гра ---------- */
function resetGame(){
  mine=[];size=4;horiz=true;meReady=opReady=false;inShots=[];outShots=[];
  last=winner=opShips=target=null;waiting=false;
}
function handle(m){
  if(m.t==='ready'){opReady=true;tryStart();render()}
  else if(m.t==='start'){turn=m.guestFirst?'me':'op';phase='battle';render()}
  else if(m.t==='shot')onShot(m.r,m.c);
  else if(m.t==='res')onRes(m);
  else if(m.t==='again'){resetGame();phase='place';render()}
}
function tryStart(){
  if(isHost&&meReady&&opReady&&phase==='place'){
    const gf=Math.random()<.5;turn=gf?'op':'me';
    send({t:'start',guestFirst:gf});phase='battle';
  }
}
const isHit=(a,r,c)=>a.some(x=>x.h&&x.r===r&&x.c===c);
function onShot(r,c){
  const sh=mine.find(s=>s.some(p=>p[0]===r&&p[1]===c));
  inShots.push({r,c,h:sh?1:0});
  let s=0,auto=[],win=false;
  if(sh){
    s=sh.every(p=>isHit(inShots,p[0],p[1]))?1:0;
    if(s)sh.forEach(p=>{for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const a=p[0]+dr,b=p[1]+dc;
      if(a>=0&&a<10&&b>=0&&b<10&&!inShots.some(x=>x.r===a&&x.c===b)){inShots.push({r:a,c:b,h:0});auto.push([a,b])}}});
    win=mine.every(x=>x.every(p=>isHit(inShots,p[0],p[1])));
  }else turn='me';
  last={by:'op',h:sh?1:0,s};
  send({t:'res',r,c,h:sh?1:0,s,auto,win,ships:win?mine:null});
  if(win){phase='over';winner='op'}
  render();
}
function onRes(m){
  outShots.push({r:m.r,c:m.c,h:m.h});
  m.auto.forEach(([a,b])=>outShots.push({r:a,c:b,h:0}));
  if(!m.h)turn='op';
  last={by:'me',h:m.h,s:m.s};waiting=false;target=null;
  if(m.win){phase='over';winner='me';opShips=m.ships}
  render();
}
const left=s=>FLEET[s]-mine.filter(x=>x.length===s).length;
const near=(r,c)=>mine.some(sh=>sh.some(p=>Math.abs(p[0]-r)<=1&&Math.abs(p[1]-c)<=1));
const at=(r,c)=>mine.findIndex(sh=>sh.some(p=>p[0]===r&&p[1]===c));
function pick(s){size=s;render()}
function rot(){horiz=!horiz;render()}
function clearAll(){mine=[];size=4;render()}
function placeTap(i){
  const r=Math.floor(i/10),c=i%10,k=at(r,c);
  if(k>=0){size=mine[k].length;mine.splice(k,1);return render()}
  if(left(size)<1)return flash('Кораблі цього розміру вже розставлені');
  const cells=[];for(let j=0;j<size;j++)cells.push(horiz?[r,c+j]:[r+j,c]);
  if(cells.some(([a,b])=>a>9||b>9||near(a,b)))return flash('Тут не можна: корабель виходить за поле або торкається іншого');
  mine.push(cells);size=[4,3,2,1].find(s=>left(s)>0)||size;render();
}
function ready(){meReady=true;send({t:'ready'});tryStart();render()}
function aim(i){
  if(waiting||outShots.some(s=>s.r*10+s.c===i))return;
  target=i;render();
}
function fire(){waiting=true;send({t:'shot',r:Math.floor(target/10),c:target%10});render()}
function again(){send({t:'again'});resetGame();phase='place';render()}

function grid(cls,click){
  return '<div class="grid">'+cls.map((c,i)=>`<div class="c ${c}"${click?` onclick="${click}(${i})"`:''}></div>`).join('')+'</div>';
}
function ownCls(ships){
  const a=Array(100).fill('');
  (ships||[]).forEach(sh=>sh.forEach(([r,c])=>a[r*10+c]='s'));
  return a;
}
function lastMsg(){
  if(!last)return'';
  return (last.by==='me'?'Ти: ':'Суперник: ')+(last.s?'потоплено!':last.h?'влучання!':'мимо');
}
const codeBox=()=>`<textarea id="out" readonly onclick="this.select()">${code}</textarea>
  <button class="b" onclick="share()">Надіслати код</button><button class="b sec" onclick="copy()">Скопіювати код</button>`;

function render(){
  const m=msg;msg='';
  let h='<h1>Морський бій</h1>';
  if(phase==='menu'){
    h+=`<p class="mut">Грають двоє: в одній Wi-Fi або через інтернет. Сервер не потрібен, телефони з’єднуються напряму.</p>
    <button class="b" onclick="hostStart()">Створити сесію</button>
    <button class="b sec" onclick="phase='guestA';render()">Підключитися до сесії</button>`;
  }else if(phase==='hostA'){
    h+=`<h2>1. Надішли цей код другому гравцю</h2><p class="mut">У месенджері або SMS. Він має відкрити цю ж сторінку й обрати «Підключитися до сесії».</p>${codeBox()}
    <h2>2. Встав його відповідь</h2><textarea id="in" placeholder="Код відповіді"></textarea>
    <button class="b" onclick="hostFinish()">З’єднати</button><button class="b sec" onclick="toMenu()">Скасувати</button>`;
  }else if(phase==='guestA'){
    h+=`<h2>Встав код сесії від хоста</h2><textarea id="in" placeholder="Код сесії"></textarea>
    <button class="b" onclick="guestStart()">Далі</button><button class="b sec" onclick="toMenu()">Назад</button>`;
  }else if(phase==='guestB'){
    h+=`<h2>Надішли цей код хосту</h2><p class="mut">Коли хост вставить його, гра почнеться сама.</p>${codeBox()}
    <button class="b sec" onclick="toMenu()">Скасувати</button>`;
  }else if(phase==='place'){
    if(meReady){
      h+=`<h2>Флот готовий</h2><p class="mut">${opReady?'Починаємо…':'Чекаємо, поки суперник розставить кораблі.'}</p>${grid(ownCls(mine))}`;
    }else{
      h+=`<h2>Розстав кораблі</h2><p class="mut">Обери корабель, торкнись клітинки — корабель ляже від неї вправо або вниз. Торкнись розставленого, щоб прибрати. Кораблі не можуть торкатися, навіть кутами.</p>
      ${grid(ownCls(mine),'placeTap')}
      <div class="bar">${[4,3,2,1].map(s=>`<button class="chip${size===s?' on':''}" ${left(s)<1?'disabled':''} onclick="pick(${s})">${s}-палубний ×${left(s)}</button>`).join('')}</div>
      <div class="bar"><button class="chip" onclick="rot()">Напрям: ${horiz?'вправо':'вниз'}</button><button class="chip" onclick="clearAll()">Очистити</button></div>
      <button class="b" ${mine.length<10?'disabled':''} onclick="ready()">Готово</button>`;
    }
  }else if(phase==='over'){
    const won=winner==='me',a=won?ownCls(opShips):ownCls(mine);
    if(won)outShots.forEach(s=>a[s.r*10+s.c]+=s.h?' h':' m');else inShots.forEach(s=>a[s.r*10+s.c]+=s.h?' h':' m');
    h+=`<h2>${won?'Перемога!':'Поразка'}</h2><p class="mut">${won?'Ти потопив увесь флот суперника.':'Суперник потопив увесь твій флот.'}</p>
    <p class="mut">${won?'Флот суперника:':'Твоє поле:'}</p>${grid(a)}<button class="b" onclick="again()">Грати ще</button>`;
  }else if(turn==='me'){
    const e=Array(100).fill('');
    outShots.forEach(s=>e[s.r*10+s.c]=s.h?'h':'m');
    if(target!==null)e[target]+=' t';
    h+=`<div class="status you">Твій хід — обери клітинку на полі суперника</div>${lastMsg()?`<p class="mut">${lastMsg()}</p>`:''}${grid(e,'aim')}
    <button class="b" ${target===null||waiting?'disabled':''} onclick="fire()">Вогонь!</button>`;
  }else{
    const a=ownCls(mine);
    inShots.forEach(s=>a[s.r*10+s.c]+=s.h?' h':' m');
    h+=`<div class="status">Хід суперника…</div>${lastMsg()?`<p class="mut">${lastMsg()}</p>`:''}<p class="mut">Твоє поле:</p>${grid(a)}`;
  }
  h+=`<p class="err">${m}</p>`;
  $('#app').innerHTML=h;
}
render();
</script>
</body>
</html>
