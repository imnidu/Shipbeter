<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Морський бій">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Морський бій</title>
<style>
/* ===== 1. Теми ===== */
:root{--paper:#dce8e6;--line:rgba(18,48,63,.06);--ink:#12303f;--sea:#c3dbe0;--grid:#93b5bd;--hit:#d2452f;--win:#2e8b57;--btn:#0f5c6e;--mut:#4d6b78;--card:rgba(255,255,255,.5);--hd:rgba(255,255,255,.7);--hl:rgba(255,255,255,.22);--hs:rgba(0,0,0,.28);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f2230;--line:rgba(220,232,230,.05);--ink:#dce8e6;--sea:#17394a;--grid:#2c5a6c;--win:#3fae76;--btn:#2a8aa0;--mut:#9fbac4;--card:rgba(255,255,255,.04);--hd:rgba(15,34,48,.65);--hl:rgba(15,34,48,.3);--hs:rgba(15,34,48,.3);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f2230;--line:rgba(220,232,230,.05);--ink:#dce8e6;--sea:#17394a;--grid:#2c5a6c;--win:#3fae76;--btn:#2a8aa0;--mut:#9fbac4;--card:rgba(255,255,255,.04);--hd:rgba(15,34,48,.65);--hl:rgba(15,34,48,.3);--hs:rgba(15,34,48,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

/* ===== 2. База ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px}
#app{max-width:460px;margin:0 auto;padding:12px 14px 28px}
h2{font:700 20px system-ui;margin:6px 0 4px}
p{margin:6px 0}
.mut{color:var(--mut)}
.lbl{font:700 12px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.top h1{font:italic 700 28px Georgia,serif;margin:0}
.err{color:var(--hit);min-height:22px;font-weight:600}
.center{text-align:center}

/* ===== 3. Компоненти ===== */
button,input{font:inherit;border-radius:10px}
.b{display:block;width:100%;padding:14px;border:0;background:var(--btn);color:#fff;font-weight:600;margin:10px 0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.b.sec{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.b:disabled{opacity:.4}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{flex:1;min-width:64px;padding:10px 6px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600}
.chip.on{background:var(--ink);color:var(--paper)}
.chip:disabled{opacity:.35}
input{-webkit-user-select:text;user-select:text}
.codein{width:100%;padding:10px;border:2px solid var(--ink);background:var(--sea);color:var(--ink);font:700 28px Georgia,serif;letter-spacing:.3em;text-align:center}
.code{font:700 64px Georgia,serif;letter-spacing:.12em;text-align:center;margin:20px 0}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px;box-shadow:0 2px 0 rgba(18,48,63,.18),0 8px 20px rgba(18,48,63,.12)}
.status{padding:10px 12px;border-left:5px solid var(--btn);background:rgba(127,127,127,.15);border-radius:0 10px 10px 0;margin:8px 0;font-weight:600}
.status.you{border-color:var(--hit)}
.status.ok{border-color:var(--win)}
.last{margin:4px 2px;color:var(--mut)}
.last.hit b{color:var(--hit)}
.pills{display:flex;gap:8px;margin:0 0 8px}
.pills span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;padding:6px;border:2px solid var(--ink);border-radius:999px;font-size:14px}
.pills b{font-size:17px}
.banner{padding:14px;border-radius:14px;border:2px solid var(--ink);margin:6px 0 10px}
.banner h2{margin:0;font-size:26px}
.banner.win{border-color:var(--win)}.banner.win h2{color:var(--win)}
.banner.lose{border-color:var(--hit)}.banner.lose h2{color:var(--hit)}

/* ===== 4. Поле бою ===== */
.bhead{display:flex;align-items:flex-end;justify-content:space-between;margin:10px 2px 6px;min-height:44px}
.fleetbtn{position:relative;width:44px;height:44px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center}
.fleetbtn:active{transform:scale(.94)}
.badge{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--hit);color:#fff;font:700 12px system-ui;display:grid;place-items:center}
.board{display:grid;grid-template-columns:1.5em 1fr;gap:2px}
.cols{display:grid;grid-template-columns:repeat(10,1fr)}
.rows{display:grid;grid-template-rows:repeat(10,1fr)}
.cols b,.rows b{font:600 11px system-ui;color:var(--mut);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(10,1fr);border:2px solid var(--ink);border-radius:6px;background:var(--sea)}
.c{aspect-ratio:1;border:.5px solid var(--grid);position:relative}
.c.m::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--ink);opacity:.55}
.c.h::before,.c.h::after{content:"";position:absolute;left:12%;right:12%;top:47%;height:6%;min-height:2px;background:var(--hit)}
.c.h::before{transform:rotate(45deg)}
.c.h::after{transform:rotate(-45deg)}
.c.s{background:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.c.s.h{background:#5a2a24}

.c.t{outline:3px solid var(--hit);outline-offset:-3px;z-index:1}

/* ===== 5. Анімації ===== */
.enter{animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.c.a-hit{animation:hitpop .7s ease-out;z-index:2}
@keyframes hitpop{0%{transform:scale(.3);background:var(--hit)}45%{transform:scale(1.6);background:var(--hit);box-shadow:0 0 0 5px rgba(210,69,47,.45)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(210,69,47,0)}}
.c.a-miss{z-index:2}
.c.a-miss::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--ink);animation:ring .8s ease-out forwards}
.c.a-miss::after{animation:dot .45s ease-out}
@keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(2.8);opacity:0}}
@keyframes dot{from{transform:scale(0)}to{transform:scale(1)}}
.c.t.w{animation:pulse .45s infinite alternate}
@keyframes pulse{to{background:rgba(210,69,47,.4)}}

/* ===== 6. Панель флоту суперника ===== */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(5,20,30,.6);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:340px;padding:18px;background:var(--paper);border:2px solid var(--ink);border-radius:16px}
.sheet h2{margin:0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--grid)}
.fname{font-weight:600;font-size:14px}
.ships{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;gap:2px}
.seg i{display:block;width:16px;height:16px;border-radius:3px;background:var(--ink)}
.seg.dead i{background:var(--hit);opacity:.45}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 0}

/* ===== 7. Панель кораблів і перетягування ===== */
.dock{display:flex;flex-wrap:wrap;gap:12px 20px;margin:10px 0;padding:10px;border:2px dashed var(--grid);border-radius:12px;min-height:64px;align-items:flex-end}
.dockitem{display:flex;align-items:flex-end;gap:6px}
.dockitem small{color:var(--mut);font-weight:700}
.dockship{display:inline-flex;gap:2px;padding:6px;border-radius:8px;touch-action:none;cursor:grab}
.dockship.v{flex-direction:column}
.dockship.sel{outline:2px solid var(--btn);background:rgba(127,127,127,.15)}
.dockship i{display:block;width:22px;height:22px;border-radius:4px;background:var(--ink)}
.ghost{position:fixed;z-index:20;display:flex;pointer-events:none;opacity:.85}
.ghost.v{flex-direction:column}
.ghost.del{opacity:.35;filter:grayscale(1);outline:2px dashed var(--hit)}
.ghost i{display:block;width:var(--seg);height:var(--seg);background:var(--ink);border:1px solid var(--paper)}
.grid.pl .c.s{touch-action:none}
.c.pv-ok{background:rgba(46,139,87,.55)}
.c.pv-bad{background:rgba(210,69,47,.5)}
.c.gh{opacity:.3}

/* ===== 8. Звук, зв’язок, рахунок ===== */
.top .tools{margin-left:auto;display:flex;gap:8px}
.iconbtn{position:relative;width:40px;height:40px;padding:0;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:18px;display:grid;place-items:center}
.dotbadge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--hit);color:#fff;font:700 12px system-ui;display:grid;place-items:center}
.linkbar{margin:0 0 8px;padding:8px 12px;border-radius:10px;background:var(--hit);color:#fff;font-weight:600;font-size:14px}
.linkbar.info{background:var(--btn)}
.score{font:700 14px system-ui;letter-spacing:.08em;color:var(--mut);text-align:center;margin:-2px 0 8px}
.tip{font-size:13px;color:var(--mut);margin-top:18px;text-align:center}

/* ===== 9. Чат ===== */
.chatback{position:fixed;inset:0;z-index:30;background:rgba(5,20,30,.45)}
.chatpanel{position:fixed;z-index:31;top:env(safe-area-inset-top,0px);left:0;right:0;margin:0 auto;max-width:460px;height:min(62vh,440px);display:flex;flex-direction:column;padding:10px 12px;background:var(--paper);border:2px solid var(--ink);border-top:0;border-radius:0 0 16px 16px}
.chathead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.chatlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.msg{display:flex}
.msg span{max-width:80%;padding:7px 11px;border-radius:14px;font-size:15px;word-break:break-word}
.msg.me{justify-content:flex-end}
.msg.me span{background:var(--btn);color:#fff;border-bottom-right-radius:4px}
.msg.op span{background:rgba(127,127,127,.22);border-bottom-left-radius:4px}
.chatrow{display:flex;gap:8px;margin-top:8px}
.chatrow input{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--ink);background:var(--sea);color:var(--ink);font-size:16px}
.chatrow button{width:48px;border:0;background:var(--btn);color:#fff;font-size:18px}

/* ===== 11. Реакції ===== */
#fx{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.fx{position:absolute;bottom:90px;display:flex;flex-direction:column;align-items:center;font-size:44px;line-height:1;animation:floatup 2.4s ease-out forwards}
.fx small{margin-top:2px;font:700 11px system-ui;color:var(--mut)}
@keyframes floatup{0%{transform:translate(0,0) scale(.4);opacity:0}12%{opacity:1;transform:translate(0,-16px) scale(1.15)}100%{transform:translate(var(--dx),-68vh) scale(1);opacity:0}}
.reacts{display:flex;gap:6px;margin:12px 0}
.reacts button{flex:1;min-width:0;padding:8px 0;font-size:22px;line-height:1.1;border:2px solid var(--ink);border-radius:12px;background:transparent}
.reacts button:active{transform:scale(.9)}

/* ===== 12. Статистика ===== */
.overlay .backdrop{position:absolute;inset:0}
.sheet.tall{position:relative;max-height:86vh;overflow-y:auto}
.stats{width:100%;border-collapse:collapse;margin:4px 0 16px}
.stats th{padding:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:center}
.stats td{padding:7px 4px;border-bottom:1px dashed var(--grid);font-size:14px}
.stats td:not(:first-child){text-align:center;font-weight:700}
.sheet h3{margin:14px 0 2px;font-size:16px}

/* ===== 10. Нік ===== */
.nickbox{margin:0 0 14px}
.nickrow{display:flex;gap:8px;margin-top:6px}
.nickrow input{flex:1;min-width:0;padding:11px 12px;border:2px solid var(--ink);background:var(--sea);color:var(--ink);font-size:16px}
.nickrow .b{width:auto;margin:0;padding:11px 14px;box-shadow:none}

@media (prefers-reduced-motion:reduce){.enter,.overlay,.fx,.c,.c::before,.c::after{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="chat"></div>
<div id="fx"></div>
<script>
'use strict';

/* ================================================================
   МОРСЬКИЙ БІЙ: клієнт

   Шари (кожен знає лише про попередні; зв’язок «вгору» йде через Net.hooks):
     1. Config     CFG, MSG, ICON
     2. Utils      $, esc, wins, Store
     3. State      S: єдиний стан; freshGame, inGame
     4. Domain     Board, Fleet: правила гри; Names, Pair, Stats: ніки, рахунок і статистика
     5. Services   Sound, Keep, Wake, Shell, Net (транспорт), Session (збереження)
     6. Logic      Placement, Chat, Reactions, Game
     7. UI         Drag, UI, Views, Actions
     8. Boot       події, з’єднання хуків, запуск
   ================================================================ */

/* ================================================================
   1. CONFIG
   ================================================================ */
const CFG = {
  fleet: { 4: 1, 3: 2, 2: 3, 1: 4 },     // розмір корабля → кількість
  n: 10,
  letters: 'АБВГДЕЖЗИК'.split(''),
  holdMs: 1100,                          // скільки показувати результат пострілу перед зміною екрана
  animMs: 900,                           // скільки діє анімація клітинки
  tapMs: 450,                            // вікно подвійного дотику
  dragGuardMs: 400,                      // ігнорувати «клік» одразу після перетягування
  nickMax: 16, chatMax: 300, chatKeep: 100,
  reactions: ['❤️', '😂', '😮', '🔥', '😏', '😭', '👏', '🎯'],   // швидкі реакції
  reactMs: 500,                          // не частіше, ніж раз на стільки мс
  gamesKeep: 300,                        // скільки останніх партій зберігаємо для статистики
  sessionMs: 6 * 3600e3,                 // скільки сервер тримає кімнату
  wakeSlowMs: 1500,                      // після скількох мс без відповіді сервера показати «прокидається»
  keepWarmMs: 10 * 60 * 1000,            // як часто «торкатись» сервера, щоб він не засинав
};
const TOTAL_SHIPS = Object.values(CFG.fleet).reduce((a, b) => a + b, 0);
const SIZES = Object.keys(CFG.fleet).map(Number).sort((a, b) => b - a);
const MSG = {
  noServer: 'Сервер не відповідає. Якщо він щойно прокинувся, зачекай хвилину й спробуй ще.',
};
const ICON = {
  anchor: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V21M7 12h10M4.5 15c.6 3.4 3.8 6 7.5 6s6.9-2.6 7.5-6"/></svg>',
  ship: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16h18l-3 4H6z"/><path d="M12 3v12M12 4l6 9h-6M12 7l-5 6h5"/></svg>',
};

/* ================================================================
   2. UTILS
   ================================================================ */
const $ = (sel) => document.querySelector(sel);
const esc = (t) => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** «1 перемога», «2 перемоги», «5 перемог» */
const wins = n => (n % 10 === 1 && n % 100 !== 11 ? 'перемога' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'перемоги' : 'перемог');
/** Сегменти корабля для панелі, «привида» та панелі флоту */
const shipSegs = (n) => '<i></i>'.repeat(n);

/** Збереження в пам’яті браузера (переживає закриття вкладки) */
const Store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  del(key) { try { localStorage.removeItem(key); } catch {} },
};

/* ================================================================
   3. STATE: єдине джерело правди; екран завжди малюється з нього
   ================================================================ */
/** Усе, що стосується однієї партії: скидається при «Грати ще» */
const freshGame = () => ({
  mine: [],              // мої кораблі: [[ [r,c], ... ], ...]
  size: 4, horiz: true,  // що ставлю зараз
  meReady: false, opReady: false,
  turn: 'me',            // чий хід: 'me' | 'op'
  inShots: [],           // постріли суперника по мені
  outShots: [],          // мої постріли
  sunk: [],              // довжини потоплених кораблів суперника
  last: null,            // останній постріл (для підпису)
  lastCell: null,        // остання клітинка (для анімації)
  winner: null, opShips: null,
  target: null, waiting: false,
  holdView: null,        // тимчасово утримує екран після пострілу
  endView: 'enemy',      // що показувати після кінця гри
  fleetOpen: false,      // відкрита панель флоту суперника
  statsOpen: false,      // відкрита панель статистики
  tap: null,             // останній дотик по кораблю (для подвійного дотику)
  againMe: false, againOp: false,   // хто вже натиснув «Грати ще»
  opLeft: false,         // суперник вийшов у меню після кінця гри
  lastRes: null,         // остання відповідь на постріл (щоб повторити її, якщо суперник повторить постріл)
});
const freshChat = () => ({ open: false, msgs: [], unread: 0, draft: '' });
/** phase: menu | guestCode | hostWait | place | battle | over  (збігається з ключами Views) */
const S = {
  phase: 'menu', isHost: false, code: '', msg: '', joinCode: '', link: 'up',   // link: 'up' | 'down'
  nick: Store.get('mb-nick', ''), opNick: '', chat: freshChat(),
  ...freshGame(),
};
const resetGame = () => Object.assign(S, freshGame());
const inGame = () => ['place', 'battle', 'over'].includes(S.phase);

/* ================================================================
   4. DOMAIN: правила гри та профіль (без DOM і мережі)
   ================================================================ */
const Board = {
  idx: (r, c) => r * CFG.n + c,
  rc: (i) => [Math.floor(i / CFG.n), i % CFG.n],
  inside: (r, c) => r >= 0 && c >= 0 && r < CFG.n && c < CFG.n,
  isHit: (shots, r, c) => shots.some(s => s.h && s.r === r && s.c === c),
  wasShot: (shots, r, c) => shots.some(s => s.r === r && s.c === c),
  shipAt: (ships, r, c) => ships.findIndex(sh => sh.some(p => p[0] === r && p[1] === c)),
  touches: (ships, r, c) => ships.some(sh => sh.some(p => Math.abs(p[0] - r) <= 1 && Math.abs(p[1] - c) <= 1)),
  isSunk: (ship, shots) => ship.every(p => Board.isHit(shots, p[0], p[1])),
  /** Клітинки корабля, що починається в (r, c) */
  shape: (r, c, size, horiz) => Array.from({ length: size }, (_, j) => (horiz ? [r, c + j] : [r + j, c])),

  /** Додає промахи навколо потопленого корабля, повертає додані клітинки */
  surround(ship, shots) {
    const added = [];
    ship.forEach(([r, c]) => {
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const a = r + dr, b = c + dc;
          if (Board.inside(a, b) && !Board.wasShot(shots, a, b)) { shots.push({ r: a, c: b, h: 0, a: 1 }); added.push([a, b]); }
        }
    });
    return added;
  },
  /** Приймає постріл по моїх кораблях: дописує його в shots і повертає результат */
  takeShot(ships, shots, r, c) {
    const ship = ships[Board.shipAt(ships, r, c)];
    shots.push({ r, c, h: ship ? 1 : 0 });
    let len = 0, auto = [];
    if (ship && Board.isSunk(ship, shots)) { len = ship.length; auto = Board.surround(ship, shots); }
    return { hit: ship ? 1 : 0, len, auto, win: !!ship && ships.every(sh => Board.isSunk(sh, shots)) };
  },
  /** Класи для 100 клітинок: кораблі + постріли + анімація останньої клітинки */
  classes(ships, shots, side) {
    const a = Array(CFG.n * CFG.n).fill('');
    (ships || []).forEach(sh => sh.forEach(([r, c]) => (a[Board.idx(r, c)] = 's')));
    (shots || []).forEach(s => (a[Board.idx(s.r, s.c)] += s.h ? ' h' : ' m'));
    const lc = S.lastCell;
    if (lc && lc.side === side && Date.now() - lc.t < CFG.animMs) a[lc.i] += lc.h ? ' a-hit' : ' a-miss';
    return a;
  },
};
const Fleet = {
  left: (size) => CFG.fleet[size] - S.mine.filter(x => x.length === size).length,
  myLeft: () => S.mine.filter(sh => !Board.isSunk(sh, S.inShots)).length,
  enemyLeft: () => TOTAL_SHIPS - S.sunk.length,
};

/** Відображувані імена (при однакових ніках гість отримує «(2)») */
const Names = {
  clean: t => String(t || '').trim().slice(0, CFG.nickMax),
  same: () => !!S.nick && !!S.opNick && S.nick.toLowerCase() === S.opNick.toLowerCase(),
  me: () => (Names.same() && !S.isHost ? S.nick + ' (2)' : S.nick) || 'Ти',
  op: () => (S.opNick ? (Names.same() && S.isHost ? S.opNick + ' (2)' : S.opNick) : 'Суперник'),
};
/** Накопичена статистика пари гравців за нікнеймами; зберігається між сесіями й закриттям вкладки */
const Pair = {
  key: () => [Names.me(), Names.op()].map(n => n.toLowerCase()).sort().join('|'),
  rec: () => Store.get('mb-pairs', {})[Pair.key()] || { w: {}, streak: { who: '', n: 0 } },
  record(who) {
    const all = Store.get('mb-pairs', {}), r = Pair.rec(), name = (who === 'me' ? Names.me() : Names.op()).toLowerCase();
    r.w[name] = (r.w[name] || 0) + 1;
    r.streak = r.streak.who === name ? { who: name, n: r.streak.n + 1 } : { who: name, n: 1 };
    all[Pair.key()] = r;
    Store.set('mb-pairs', all);
  },
  get() {
    const r = Pair.rec(), me = Names.me().toLowerCase(), op = Names.op().toLowerCase();
    return { me: r.w[me] || 0, op: r.w[op] || 0, streak: r.streak, who: r.streak.who === me ? Names.me() : Names.op() };
  },
};

/** Статистика партій на цьому пристрої: список партій, з якого рахуються і загальні цифри, і цифри проти конкретного суперника */
const Stats = {
  all: () => Store.get('mb-games', []),
  vs: (name) => Stats.all().filter(g => g.op.toLowerCase() === name.toLowerCase()),
  /** Записує щойно завершену партію (автоматичні промахи навколо потоплених не рахуються пострілами) */
  record(winner) {
    const real = shots => shots.filter(s => !s.a), mine = real(S.outShots), theirs = real(S.inShots);
    const game = {
      t: Date.now(), me: Names.me(), op: Names.op(), w: winner,
      myShots: mine.length, myHits: mine.filter(s => s.h).length, opShots: theirs.length, opHits: theirs.filter(s => s.h).length,
      mySunk: S.sunk.length, opSunk: S.mine.filter(sh => Board.isSunk(sh, S.inShots)).length,
    };
    Store.set('mb-games', [...Stats.all(), game].slice(-CFG.gamesKeep));
  },
  /** Підсумок по одному з гравців ('me' або 'op') */
  side(list, who) {
    const [shotsK, hitsK, sunkK] = who === 'me' ? ['myShots', 'myHits', 'mySunk'] : ['opShots', 'opHits', 'opSunk'];
    const sum = k => list.reduce((a, g) => a + g[k], 0), won = list.filter(g => g.w === who);
    let run = 0, best = 0;
    list.forEach(g => { run = g.w === who ? run + 1 : 0; best = Math.max(best, run); });
    const shots = sum(shotsK), hits = sum(hitsK);
    return {
      games: list.length, wins: won.length, shots, hits, sunk: sum(sunkK), streak: best,
      acc: shots ? Math.round(hits * 100 / shots) : null,
      fastest: won.length ? Math.min(...won.map(g => g[shotsK])) : null,   // найменше пострілів у виграній партії
    };
  },
};

   ================================================================ */
/** Звуки синтезуються, файли не потрібні */
const Sound = {
  ctx: null,
  on: !!Store.get('mb-sound', true),
  unlock() {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!Sound.ctx && A) Sound.ctx = new A();
    if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
  },
  toggle() { Sound.on = !Sound.on; Store.set('mb-sound', Sound.on); },
  tone(freq, at, dur, { type = 'sine', vol = 0.25, to = null } = {}) {
    const c = Sound.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
  },
  noise(at, dur, { vol = 0.3, freq = 800 } = {}) {
    const c = Sound.ctx, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(c.destination); src.start(c.currentTime + at);
  },
  play(name) {
    if (!Sound.on || !Sound.ctx) return;
    const p = {
      miss: () => { Sound.noise(0, 0.35, { vol: 0.25, freq: 1200 }); Sound.tone(420, 0, 0.25, { to: 180, vol: 0.12 }); },
      hit: () => { Sound.noise(0, 0.5, { vol: 0.5, freq: 600 }); Sound.tone(150, 0, 0.4, { type: 'square', to: 40, vol: 0.3 }); },
      sunk: () => { p.hit(); [520, 390, 260].forEach((f, i) => Sound.tone(f, 0.25 + i * 0.16, 0.3, { type: 'triangle', vol: 0.22 })); },
      turn: () => { Sound.tone(660, 0, 0.12, { vol: 0.18 }); Sound.tone(880, 0.12, 0.18, { vol: 0.18 }); },
      win: () => [523, 659, 784, 1047].forEach((f, i) => Sound.tone(f, i * 0.14, 0.3, { type: 'triangle', vol: 0.25 })),
      msg: () => Sound.tone(880, 0, 0.12, { vol: 0.15 }),
      pop: () => { Sound.tone(520, 0, 0.08, { vol: 0.12 }); Sound.tone(780, 0.07, 0.1, { vol: 0.1 }); },
      lose: () => [392, 330, 262, 196].forEach((f, i) => Sound.tone(f, i * 0.2, 0.4, { type: 'sawtooth', vol: 0.12 })),
    };
    try { p[name](); } catch {}
  },
  shot: (hit, sunk) => Sound.play(sunk ? 'sunk' : hit ? 'hit' : 'miss'),
};

/** Не дає екрану згаснути під час гри */
const Keep = {
  lock: null,
  async on() {
    try {
      if (!navigator.wakeLock || Keep.lock) return;
      Keep.lock = await navigator.wakeLock.request('screen');
      Keep.lock.addEventListener('release', () => (Keep.lock = null));
    } catch {}
  },
};

/** Безкоштовний сервер засинає без запитів: будимо його, показуємо стан і не даємо заснути, поки гра відкрита */
const Wake = {
  state: 'ok',                         // 'ok' | 'waking' | 'down'
  hooks: { change() {} },
  set(state) { if (Wake.state !== state) { Wake.state = state; Wake.hooks.change(); } },
  async ping() {
    const slow = setTimeout(() => Wake.set('waking'), CFG.wakeSlowMs);
    try { const r = await fetch('/healthz', { cache: 'no-store' }); Wake.set(r.ok ? 'ok' : 'down'); }
    catch { Wake.set('down'); }
    clearTimeout(slow);
  },
  start() { Wake.ping(); setInterval(Wake.ping, CFG.keepWarmMs); },
};

/** Оболонка гри в кеші браузера (sw.js): відкривається миттєво; повідомляє, коли на сервері нова версія */
const Shell = {
  updated: false,
  hooks: { change() {} },
  register() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.t === 'update') { Shell.updated = true; Shell.hooks.change(); }
    });
  },
};

/**
 * Транспорт: сервер-посередник пересилає повідомлення між двома гравцями.
 * Net нічого не знає про гру й екран: про події повідомляє через Net.hooks (їх підключає Boot).
 */
const Net = {
  room: null,    // { code, token } активної кімнати
  es: null,      // EventSource: вхідні повідомлення
  lastId: 0,     // останнє оброблене повідомлення (після розриву нічого не губимо й не повторюємо)
  n: 0,          // лічильник вихідних повідомлень (сервер ігнорує повтори)
  out: [],       // вихідні повідомлення, що ще не дійшли до сервера
  busy: false,
  hooks: { joined() {}, message() {}, link() {}, closed() {}, committed() {} },

  async api(path, body) {
    const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || (r.status === 404 ? 'Сервер гри не знайдено. Відкрий гру за адресою свого сервера.' : 'Помилка сервера')), { status: r.status });
    return j;
  },
  /** Чекає, поки вихідні повідомлення дійдуть до сервера (щоб не втратити їх при виході) */
  async drain(ms) {
    const t0 = Date.now();
    while (Net.out.length && Date.now() - t0 < ms) await new Promise(r => setTimeout(r, 50));
  },
  create: () => Net.api('create', {}),
  join: (code) => Net.api('join', { code }),
  reset() {
    try { Net.es && Net.es.close(); } catch {}
    Object.assign(Net, { room: null, es: null, lastId: 0, n: 0, out: [], busy: false });
  },

  /** Підписується на кімнату; resume дозволяє продовжити з того ж місця після перезавантаження сторінки */
  open(room, resume = {}) {
    Net.reset();
    Object.assign(Net, { room: { code: room.code, token: room.token }, lastId: resume.lastId || 0, n: resume.n || 0, out: resume.out || [] });
    const url = `/api/events?code=${room.code}&token=${room.token}` + (Net.lastId ? '&after=' + Net.lastId : '');
    const es = (Net.es = new EventSource(url));
    es.onopen = () => Net.hooks.link(true);
    es.onerror = () => (es.readyState === 2 ? Net.hooks.closed('Сесію завершено або сервер перезапустився') : Net.hooks.link(false));
    es.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.id <= Net.lastId) return;                 // повтор після перепідключення
      if (m.sys === 'joined') Net.hooks.joined();
      else { try { Net.hooks.message(JSON.parse(m.msg)); } catch {} }
      Net.lastId = m.id;                              // запам’ятовуємо лише після обробки
      Net.hooks.committed();
    };
    if (Net.out.length) Net._flush();
  },
  send(o) {
    if (!Net.room) return;
    Net.out.push({ n: ++Net.n, msg: JSON.stringify(o) });
    Net._flush();
  },
  /** Надсилає чергу по одному, повторюючи при збої, щоб порядок не порушився */
  async _flush() {
    if (Net.busy) return;
    Net.busy = true;
    while (Net.out.length && Net.room) {
      const item = Net.out[0];
      try { await Net.api('send', { ...Net.room, n: item.n, msg: item.msg }); Net.out.shift(); }
      catch (e) {
        if (e.status === 404) { Net.busy = false; return Net.hooks.closed('Сесію завершено'); }
        await new Promise(r => setTimeout(r, 1500));
      }
    }
    Net.busy = false;
  },
};

/** Знімок гри: після закриття вкладки гра відновлюється з того ж місця */
const Session = {
  KEY: 'mb-session',
  PHASES: ['hostWait', 'place', 'battle', 'over'],
  save() {
    if (!Net.room || !Session.PHASES.includes(S.phase)) return Store.del(Session.KEY);
    const { holdView, fleetOpen, statsOpen, msg, joinCode, link, ...state } = S;
    Store.set(Session.KEY, { v: 1, t: Date.now(), state, room: Net.room, lastId: Net.lastId, n: Net.n, out: Net.out });
  },
  restore() {
    const snap = Store.get(Session.KEY, null);
    if (!snap || snap.v !== 1 || Date.now() - snap.t > CFG.sessionMs) return false;
    Object.assign(S, snap.state, { holdView: null, fleetOpen: false, statsOpen: false, link: 'up', msg: '' });
    S.chat.open = false;
    Net.open(snap.room, { lastId: snap.lastId, n: snap.n, out: snap.out });
    return true;
  },
};

/* ================================================================
   6. LOGIC: правила взаємодії; працює зі станом і мережею, без DOM
   ================================================================ */
/** Розстановка кораблів. Методи, що можуть відмовити, повертають текст помилки або null */
const Placement = {
  canPlace(cells, ignore = -1) {
    const others = S.mine.filter((_, i) => i !== ignore);
    return cells.every(([a, b]) => Board.inside(a, b) && !Board.touches(others, a, b));
  },
  /** Обирає наступний розмір, що ще лишився */
  selectNext() { S.size = SIZES.find(s => Fleet.left(s) > 0) || S.size; },
  place(i) {
    const [r, c] = Board.rc(i);
    if (Board.shipAt(S.mine, r, c) >= 0) return null;          // дотики по кораблях обробляє Drag
    if (Fleet.left(S.size) < 1) return 'Кораблі цього розміру вже розставлені';
    const cells = Board.shape(r, c, S.size, S.horiz);
    if (!Placement.canPlace(cells)) return 'Тут не можна: корабель виходить за поле або торкається іншого';
    S.mine.push(cells);
    Placement.selectNext();
    return null;
  },
  /** Дотик по кораблю: другий дотик протягом CFG.tapMs повертає його */
  tapShip(k) {
    if (S.tap && S.tap.k === k && Date.now() - S.tap.t < CFG.tapMs) { S.tap = null; return Placement.rotate(k); }
    S.tap = { k, t: Date.now() };
    return null;
  },
  /** Повертає корабель на 90°, при потребі зсуваючи його від краю */
  rotate(k) {
    const ship = S.mine[k], n = ship.length;
    if (n < 2) return null;
    const vert = ship[0][1] === ship[1][1], [r0, c0] = ship[0];
    for (let off = 0; off < n; off++) {
      const cells = Board.shape(vert ? r0 : r0 - off, vert ? c0 - off : c0, n, vert);
      if (Placement.canPlace(cells, k)) { S.mine[k] = cells; return null; }
    }
    return 'Не вистачає місця, щоб повернути корабель';
  },
  clear() { S.mine = []; S.size = SIZES[0]; },
  /** Випадкова розстановка всього флоту */
  randomize() {
    const sizes = SIZES.flatMap(sz => Array(CFG.fleet[sz]).fill(sz)), rnd = () => Math.floor(Math.random() * CFG.n);
    for (let attempt = 0; attempt < 60; attempt++) {
      const ships = [];
      const ok = sizes.every(size => {
        for (let k = 0; k < 200; k++) {
          const cells = Board.shape(rnd(), rnd(), size, Math.random() < 0.5);
          if (cells.every(([a, b]) => Board.inside(a, b) && !Board.touches(ships, a, b))) { ships.push(cells); return true; }
        }
        return false;
      });
      if (ok) { S.mine = ships; Placement.selectNext(); return; }
    }
  },
};

const Chat = {
  receive(text) {
    S.chat.msgs.push({ from: 'op', text: String(text).slice(0, CFG.chatMax) });
    if (S.chat.msgs.length > CFG.chatKeep) S.chat.msgs.shift();
    if (!S.chat.open) { S.chat.unread++; Sound.play('msg'); }
  },
  send() {
    const text = (S.chat.draft || '').trim().slice(0, CFG.chatMax);
    if (!text) return;
    S.chat.msgs.push({ from: 'me', text });
    S.chat.draft = '';
    Net.send({ t: 'chat', text });
  },
};

/** Швидкі емодзі-реакції: летять угору екраном у обох гравців */
const Reactions = {
  last: 0,
  send(e) {
    if (!CFG.reactions.includes(e) || Date.now() - Reactions.last < CFG.reactMs) return;
    Reactions.last = Date.now();
    UI.floatEmoji(e, true);
    Net.send({ t: 'react', e });
  },
  receive(e) {
    if (!CFG.reactions.includes(e)) return;           // приймаємо лише відомі емодзі
    UI.floatEmoji(e, false);
    Sound.play('pop');
  },
};

/** Протокол і перебіг партії: готовність → бій → кінець → реванш */
const Game = {
  holdTimer: null,

  connected() {
    Keep.on();
    S.phase = 'place';
    Net.send({ t: 'hello', nick: S.nick });
    UI.render();
  },

  /** Усі повідомлення від суперника: тип → обробник */
  onMessage(m) {
    const handlers = {
      hello: () => { S.opNick = Names.clean(m.nick); },
      chat: () => Chat.receive(m.text),
      react: () => Reactions.receive(m.e),
      ready: () => { S.opReady = true; Game.tryStart(); },
      unready: () => {   // гість просить хоста скасувати готовність, а хост лише повідомляє гостя
        if (!S.isHost) S.opReady = false;
        else if (S.phase === 'place') { S.opReady = false; Net.send({ t: 'unready-ok' }); }
      },
      'unready-ok': () => { S.meReady = false; },
      start: () => { if (S.phase !== 'place') return; S.turn = m.guestFirst ? 'me' : 'op'; S.phase = 'battle'; if (S.turn === 'me') Sound.play('turn'); },
      shot: () => Game.receiveShot(m.r, m.c),
      res: () => Game.receiveResult(m),
      reveal: () => { S.opShips = m.ships; },
      again: () => { if (S.phase !== 'over') return; S.againOp = true; Game.tryRematch(); },
      'again-cancel': () => { S.againOp = false; },
      leave: () => { S.opLeft = true; S.againOp = false; },
    };
    if (handlers[m.t]) { handlers[m.t](); UI.render(); }
  },

  /* ---- готовність і початок бою ---- */
  ready() { S.meReady = true; Net.send({ t: 'ready' }); Game.tryStart(); },
  /** Скасувати готовність, поки суперник ще не готовий */
  unready() {
    if (S.phase !== 'place' || !S.meReady) return;
    if (S.isHost) S.meReady = false;                // хост вирішує сам
    Net.send({ t: 'unready' });                     // гість чекає підтвердження від хоста
  },
  /** Бій починає хост, коли готові обоє; він же кидає жереб */
  tryStart() {
    if (!(S.isHost && S.meReady && S.opReady && S.phase === 'place')) return;
    const guestFirst = Math.random() < 0.5;
    S.turn = guestFirst ? 'op' : 'me';
    S.phase = 'battle';
    Net.send({ t: 'start', guestFirst });
    if (S.turn === 'me') Sound.play('turn');
  },

  /* ---- бій ---- */
  aim(i) {
    if (S.turn !== 'me' || S.holdView || S.waiting || Board.wasShot(S.outShots, ...Board.rc(i))) return;
    S.target = i;
  },
  fire() {
    S.waiting = true;
    const [r, c] = Board.rc(S.target);
    Net.send({ t: 'shot', r, c });
  },
  /** Суперник стріляє по мені */
  receiveShot(r, c) {
    if (Board.wasShot(S.inShots, r, c)) {                  // повтор після розриву зв’язку: відповідаємо тим самим
      if (S.lastRes && S.lastRes.r === r && S.lastRes.c === c) Net.send(S.lastRes);
      return;
    }
    const res = Board.takeShot(S.mine, S.inShots, r, c);
    if (!res.hit) S.turn = 'me';
    S.last = { by: 'op', h: res.hit, s: res.len ? 1 : 0 };
    S.lastCell = { side: 'own', i: Board.idx(r, c), h: res.hit, t: Date.now() };
    S.lastRes = { t: 'res', r, c, h: res.hit, s: res.len ? 1 : 0, len: res.len, auto: res.auto, win: res.win, ships: res.win ? S.mine : null };
    Net.send(S.lastRes);
    Sound.shot(res.hit, res.len);
    if (res.win) Game.finish('op');
    else if (!res.hit) { Game.hold('own'); setTimeout(() => Sound.play('turn'), 650); }
  },
  /** Відповідь на мій постріл */
  receiveResult(m) {
    if (Board.wasShot(S.outShots, m.r, m.c)) return;       // повтор після розриву зв’язку
    S.outShots.push({ r: m.r, c: m.c, h: m.h });
    m.auto.forEach(([a, b]) => S.outShots.push({ r: a, c: b, h: 0, a: 1 }));
    if (m.s) S.sunk.push(m.len);
    if (!m.h) S.turn = 'op';
    S.last = { by: 'me', h: m.h, s: m.s };
    S.lastCell = { side: 'enemy', i: Board.idx(m.r, m.c), h: m.h, t: Date.now() };
    S.waiting = false; S.target = null;
    Sound.shot(m.h, m.s);
    if (m.win) { S.opShips = m.ships; Net.send({ t: 'reveal', ships: S.mine }); Game.finish('me'); }
    else if (!m.h) Game.hold('enemy');
  },
  /** Кінець партії: однаково для переможця й переможеного */
  finish(winner) {
    S.phase = 'over'; S.winner = winner; S.endView = winner === 'me' ? 'enemy' : 'own';
    Pair.record(winner);
    Stats.record(winner);
    setTimeout(() => Sound.play(winner === 'me' ? 'win' : 'lose'), 700);
  },
  /** Утримує екран на секунду, щоб було видно анімацію пострілу */
  hold(view) {
    S.holdView = view;
    clearTimeout(Game.holdTimer);
    Game.holdTimer = setTimeout(() => { S.holdView = null; UI.render(); }, CFG.holdMs);
  },

  /* ---- реванш: починається, коли «Грати ще» натиснули обоє ---- */
  again() {
    if (S.phase !== 'over' || S.againMe || S.opLeft) return;
    S.againMe = true;
    Net.send({ t: 'again' });
    Game.tryRematch();
  },
  againCancel() {
    if (!S.againMe) return;
    S.againMe = false;
    Net.send({ t: 'again-cancel' });
  },
  /** Виходимо в меню: попереджаємо суперника */
  leave() { Net.send({ t: 'leave' }); },
  tryRematch() {
    if (S.againMe && S.againOp) { resetGame(); S.phase = 'place'; }
  },
};

/** Перетягування кораблів під час розстановки (pointer-події) */
const Drag = {
  st: null, active: false, justDragged: 0, OFFSET: 46, SLOP: 8,

  recent: () => Date.now() - Drag.justDragged < CFG.dragGuardMs,
  begin(e, info) {   // info: { size, horiz, from: 'dock' | 'grid', k }
    Drag.st = { ...info, x0: e.clientX, y0: e.clientY, id: e.pointerId, moved: false, ghost: null, seg: 24 };
    Drag.active = true;
    document.addEventListener('pointermove', Drag.move);
    document.addEventListener('pointerup', Drag.end);
    document.addEventListener('pointercancel', Drag.end);
  },
  cell: (i) => document.querySelector('.grid .c[data-i="' + i + '"]'),
  /** Індекс клітинки під пальцем (з відступом, щоб палець не закривав корабель) */
  at(e) {
    const el = document.elementFromPoint(e.clientX, e.clientY - Drag.OFFSET), c = el && el.closest('.c[data-i]');
    return c ? +c.dataset.i : null;
  },
  shape: (i, st) => Board.shape(...Board.rc(i), st.size, st.horiz),
  makeGhost() {
    const st = Drag.st, c0 = document.querySelector('.grid .c'), g = document.createElement('div');
    st.seg = c0 ? c0.offsetWidth : 24;
    g.className = 'ghost' + (st.horiz ? '' : ' v');
    g.style.setProperty('--seg', st.seg + 'px');
    g.innerHTML = shipSegs(st.size);
    document.body.appendChild(g);
    st.ghost = g;
  },
  clearMarks() { document.querySelectorAll('.pv-ok,.pv-bad,.gh').forEach(el => el.classList.remove('pv-ok', 'pv-bad', 'gh')); },
  move(e) {
    const st = Drag.st;
    if (!st || e.pointerId !== st.id) return;
    if (!st.moved) {
      if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < Drag.SLOP) return;
      st.moved = true; Drag.makeGhost();
    }
    e.preventDefault();
    st.ghost.style.left = e.clientX - st.seg / 2 + 'px';
    st.ghost.style.top = e.clientY - Drag.OFFSET - st.seg / 2 + 'px';
    Drag.clearMarks();
    if (st.from === 'grid') S.mine[st.k].forEach(([r, c]) => { const el = Drag.cell(Board.idx(r, c)); el && el.classList.add('gh'); });
    const i = Drag.at(e);
    st.ghost.classList.toggle('del', st.from === 'grid' && i === null);   // за межами поля: буде прибрано
    if (i === null) return;
    const cells = Drag.shape(i, st), ok = Placement.canPlace(cells, st.from === 'grid' ? st.k : -1);
    cells.forEach(([r, c]) => { if (Board.inside(r, c)) Drag.cell(Board.idx(r, c)).classList.add(ok ? 'pv-ok' : 'pv-bad'); });
  },
  end(e) {
    const st = Drag.st;
    if (!st || e.pointerId !== st.id) return;
    ['pointermove', 'pointerup', 'pointercancel'].forEach((n, k) => document.removeEventListener(n, [Drag.move, Drag.end, Drag.end][k]));
    Drag.st = null; Drag.active = false;
    if (st.ghost) st.ghost.remove();
    Drag.clearMarks();
    if (st.moved) {
      Drag.justDragged = Date.now();
      const up = e.type === 'pointerup', i = up ? Drag.at(e) : null;
      if (st.from === 'grid' && up && i === null) { S.mine.splice(st.k, 1); S.size = st.size; }   // кинули за межі поля: прибрати
      else if (i !== null) {
        const cells = Drag.shape(i, st);
        if (Placement.canPlace(cells, st.from === 'grid' ? st.k : -1)) {
          if (st.from === 'grid') S.mine.splice(st.k, 1);
          S.mine.push(cells);
          Placement.selectNext();
        }
      }
    } else if (st.from === 'dock') {          // короткий дотик: вибрати або повернути
      if (S.size === st.size) S.horiz = !S.horiz; else S.size = st.size;
    } else if (st.from === 'grid') {          // короткий дотик по кораблю на полі: подвійний повертає
      const err = Placement.tapShip(st.k);
      if (err) S.msg = err;
    }
    UI.render();
  },
};

const UI = {
  lastPhase: null,
  go(phase) { S.phase = phase; UI.render(); },
  flash(text) { S.msg = text; UI.render(); },

  render() {
    if (Drag.active) return;            // не перебудовуємо екран під час перетягування
    const nk = $('#nick'), cd = $('#cd');
    if (nk) S.nick = Names.clean(nk.value);
    if (cd) S.joinCode = cd.value;
    const msg = S.msg; S.msg = '';
    const enter = UI.lastPhase !== S.phase; UI.lastPhase = S.phase;
    $('#app').innerHTML =
      UI.top() + UI.banners() +
      `<main class="${enter ? 'enter' : ''}">${Views[S.phase]()}<p class="err">${esc(msg)}</p></main>` +
      (S.fleetOpen ? UI.fleetSheet() : '') + (S.statsOpen ? UI.statsSheet() : '');
    UI.renderChat();
    Session.save();
  },
  /** Чат живе окремо від решти екрана, щоб не збивати клавіатуру під час набору */
  renderChat() {
    const box = $('#chat'), c = S.chat;
    if (!box) return;
    if (!c.open) { box.innerHTML = ''; return; }
    if (!box.firstChild)
      box.innerHTML = `<div class="chatback" data-act="closeChat"></div><div class="chatpanel">
        <div class="chathead"><b>Чат</b><button class="iconbtn" data-act="closeChat" aria-label="Закрити">✕</button></div>
        <div class="chatlist" id="chatlist"></div>
        <div class="chatrow"><input id="chatin" maxlength="${CFG.chatMax}" placeholder="Повідомлення…" autocomplete="off"><button data-act="chatSend" aria-label="Надіслати">➤</button></div></div>`;
    const list = $('#chatlist');
    list.innerHTML = c.msgs.map(m => `<div class="msg ${m.from}"><span>${esc(m.text)}</span></div>`).join('') || '<p class="mut center">Напиши першим 👋</p>';
    list.scrollTop = list.scrollHeight;
  },
  /** Перед створенням чи підключенням потрібен нік: запам’ятовуємо його */
  ensureNick() {
    const nk = $('#nick');
    if (nk) S.nick = Names.clean(nk.value);
    if (!S.nick) { UI.flash('Спершу введи свій нік'); return false; }
    Store.set('mb-nick', S.nick);
    return true;
  },

  /** Емодзі, що злітає вгору (поза render, щоб перемальовування екрана його не переривало) */
  floatEmoji(emoji, mine) {
    const box = $('#fx');
    if (!box || box.children.length > 14) return;
    const el = document.createElement('div');
    el.className = 'fx';
    el.style.setProperty('--dx', Math.round(Math.random() * 60 - 30) + 'px');
    el.style.left = Math.round(mine ? 58 + Math.random() * 30 : 6 + Math.random() * 30) + '%';
    el.innerHTML = `<span>${emoji}</span>` + (mine ? '' : `<small>${esc(Names.op())}</small>`);
    box.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  },

  /* ---- компоненти ---- */
  /** Смуги стану: зв’язок у грі, сервер прокидається, нова версія */
  banners: () =>
    (S.link === 'down' ? '<div class="linkbar">Зв’язок втрачено. Відновлюємо…</div>' : '') +
    (!inGame() && Wake.state === 'waking' ? '<div class="linkbar info">Сервер прокидається… це може тривати до хвилини</div>' : '') +
    (!inGame() && Wake.state === 'down' ? '<div class="linkbar">Немає зв’язку із сервером</div>' : '') +
    (Shell.updated ? '<div class="linkbar info" data-act="reload">Є нова версія гри. Торкнись, щоб оновити</div>' : ''),
  top: () => `<header class="top">${ICON.anchor}<h1>Морський бій</h1><div class="tools">` +
    (inGame() ? `<button class="iconbtn" data-act="chat" aria-label="Чат">💬${S.chat.unread ? `<span class="dotbadge">${S.chat.unread}</span>` : ''}</button>` : '') +
    `<button class="iconbtn" data-act="sound" aria-label="Звук">${Sound.on ? '🔊' : '🔇'}</button></div></header>`,
  reactBar: () => `<div class="reacts">${CFG.reactions.map(e => `<button data-act="react" data-e="${e}" aria-label="Реакція ${e}">${e}</button>`).join('')}</div>`,
  /** Панель статистики: загальна, а якщо відомий суперник, то й порівняння з ним */
  statsSheet() {
    const pct = v => (v === null ? '—' : v + '%'), num = v => (v === null ? '—' : v);
    const row = (label, a, b) => `<tr><td>${label}</td><td>${a}</td>${b === undefined ? '' : `<td>${b}</td>`}</tr>`;
    const all = Stats.side(Stats.all(), 'me');
    let html = `<h2>Статистика</h2><h3>Твоя загалом</h3><table class="stats">` +
      row('Партій', all.games) + row('Перемог', all.wins + (all.games ? ` (${Math.round(all.wins * 100 / all.games)}%)` : '')) +
      row('Поразок', all.games - all.wins) + row('Влучність', pct(all.acc)) + row('Потоплено кораблів', all.sunk) +
      row('Найшвидша перемога', all.fastest === null ? '—' : all.fastest + ' пострілів') + row('Найдовша серія перемог', all.streak) + '</table>';
    if (S.opNick) {
      const list = Stats.vs(Names.op()), a = Stats.side(list, 'me'), b = Stats.side(list, 'op');
      html += `<h3>${esc(Names.me())} і ${esc(Names.op())}</h3>` + (list.length ? `<table class="stats"><tr><th></th><th>${esc(Names.me())}</th><th>${esc(Names.op())}</th></tr>` +
        row('Перемог', a.wins, b.wins) + row('Влучність', pct(a.acc), pct(b.acc)) + row('Потоплено кораблів', a.sunk, b.sunk) +
        row('Найшвидша перемога', num(a.fastest), num(b.fastest)) + row('Найдовша серія', a.streak, b.streak) + '</table>' +
        `<p class="mut">Зіграно партій: ${list.length}</p>` : '<p class="mut">Ви ще не зіграли жодної партії.</p>');
    } else {
      const names = [...new Set(Stats.all().map(g => g.op))];
      if (names.length) html += '<h3>Суперники</h3><table class="stats">' + names.map(n => {
        const l = Stats.vs(n), w = Stats.side(l, 'me').wins;
        return row(esc(n), `${w} : ${l.length - w}`, `${l.length} парт.`);
      }).join('') + '</table>';
    }
    return `<div class="overlay"><div class="backdrop" data-act="closeStats"></div><div class="sheet tall">${html}<button class="b" data-act="closeStats">Закрити</button></div></div>`;
  },
  opStatus: () => `<div class="status${S.opReady ? ' ok' : ''}">${esc(Names.op())}: ${S.opReady ? 'готовий ✓' : 'розставляє кораблі…'}</div>`,
  pills() {
    const g = Pair.get();
    return `<div class="pills"><span>${esc(Names.me())} <b>${Fleet.myLeft()}</b>/${TOTAL_SHIPS}</span><span>${esc(Names.op())} <b>${Fleet.enemyLeft()}</b>/${TOTAL_SHIPS}</span></div>` +
      (g.me + g.op ? `<div class="score">Рахунок ${esc(Names.me())} ${g.me} : ${g.op} ${esc(Names.op())}</div>` : '') +
      (g.streak.n >= 2 ? `<div class="score">🔥 ${esc(g.who)}: ${g.streak.n} ${wins(g.streak.n)} поспіль</div>` : '');
  },
  head: (title, withFleet) =>
    `<div class="bhead"><span class="lbl">${title}</span>` +
    (withFleet ? `<button class="fleetbtn" data-act="fleet" aria-label="Флот суперника">${ICON.ship}<span class="badge">${Fleet.enemyLeft()}</span></button>` : '') +
    '</div>',
  card(cls, act) {
    const cells = cls.map((c, i) => `<div class="c ${c}"${act ? ` data-act="${act}" data-i="${i}"` : ''}></div>`).join('');
    const cols = CFG.letters.map(l => `<b>${l}</b>`).join('');
    const rows = Array.from({ length: CFG.n }, (_, i) => `<b>${i + 1}</b>`).join('');
    return `<div class="card"><div class="board"><span></span><div class="cols">${cols}</div><div class="rows">${rows}</div><div class="grid${act === 'place' ? ' pl' : ''}">${cells}</div></div></div>`;
  },
  lastMsg() {
    const l = S.last;
    if (!l) return '';
    return `<p class="last${l.h ? ' hit' : ''}"><b>${l.by === 'me' ? 'Ти' : esc(Names.op())}:</b> ${l.s ? 'потоплено!' : l.h ? 'влучання!' : 'мимо'}</p>`;
  },
  /** Панель зі станом флоту суперника: закривається дотиком будь-де */
  fleetSheet() {
    const rows = SIZES.map(size => {
      const total = CFG.fleet[size], dead = S.sunk.filter(l => l === size).length;
      const ships = Array.from({ length: total }, (_, k) => `<span class="seg${k < dead ? ' dead' : ''}">${shipSegs(size)}</span>`).join('');
      return `<div class="frow"><span class="fname">${size}-палубний</span><span class="ships">${ships}</span></div>`;
    }).join('');
    return `<div class="overlay" data-act="closeFleet"><div class="sheet"><h2>Флот суперника</h2>
      <p class="mut">Залишилось ${Fleet.enemyLeft()} з ${TOTAL_SHIPS}</p>${rows}<p class="hint">Торкнись будь-де, щоб закрити</p></div></div>`;
  },
};

    <div class="code">${S.code}</div><p class="mut center">Чекаємо на підключення…<br>Можеш спокійно перейти в месенджер: код чекатиме на сервері.</p>

  guestCode: () => `<h2>Введи код сесії</h2><p class="mut">Його має назвати той, хто створив сесію.</p>

  place() {
    if (S.meReady)
      return `<h2>Флот готовий</h2>${UI.opStatus()}${UI.card(Board.classes(S.mine, [], 'own'))}
        <button class="b sec" data-act="unready">Скасувати готовність</button>`;
    const dock = SIZES.filter(sz => Fleet.left(sz) > 0).map(sz =>
      `<div class="dockitem"><div class="dockship${S.horiz ? '' : ' v'}${S.size === sz ? ' sel' : ''}" data-dock="${sz}">${shipSegs(sz)}</div><small>×${Fleet.left(sz)}</small></div>`).join('');
    return `<h2>Розстав кораблі</h2>${UI.opStatus()}
      <p class="mut">Перетягни корабель із панелі на поле. Подвійний дотик по кораблю повертає його, а щоб прибрати, перетягни його за межі поля. Кораблі не торкаються, навіть кутами.</p>
      ${UI.head('Твоє поле')}${UI.card(Board.classes(S.mine, [], 'own'), 'place')}
      <div class="dock">${dock || '<span class="mut">Усі кораблі розставлено</span>'}</div>
      <div class="bar"><button class="chip" data-act="rotate">Повернути</button><button class="chip" data-act="random">Випадково</button><button class="chip" data-act="clear">Очистити</button></div>
      <button class="b" data-act="ready" ${S.mine.length < TOTAL_SHIPS ? 'disabled' : ''}>Готово (${S.mine.length}/${TOTAL_SHIPS})</button>`;

      ${UI.head(own ? 'Твоє поле' : 'Поле суперника', !own)}${UI.card(cls)}
      ${S.opLeft

          ? '<div class="status">Чекаємо, поки суперник теж натисне «Грати ще»…</div><button class="b sec" data-act="againCancel">Скасувати</button>'
          : (S.againOp ? '<div class="status ok">' + esc(Names.op()) + ' хоче зіграти ще</div>' : '') + '<button class="b" data-act="again">Грати ще</button>'}
      <button class="b sec" data-act="exit">Вийти</button>${UI.reactBar()}`;

};

  reload() { location.reload(); },
  react(d) { Reactions.send(d.e); },
  stats() { S.statsOpen = true; UI.render(); },
  closeStats() { S.statsOpen = false; UI.render(); },

  /* з’єднання */
  async host() {
    if (!UI.ensureNick()) return;
    try {
      S.isHost = true;
      UI.flash('Створюємо сесію…');
      const room = await Net.create();
      Net.open(room);
      S.code = room.code; UI.go('hostWait');
    } catch (e) { UI.flash(e.status ? e.message : MSG.noServer); }
  },
  goJoin: () => UI.ensureNick() && UI.go('guestCode'),
  async join() {
    const code = ($('#cd').value || '').trim();
    S.joinCode = code;
    if (!/^\d{4}$/.test(code)) return UI.flash('Введи 4 цифри коду');
    try {
      S.isHost = false;
      UI.flash('Підключаємось…');
      Net.open(await Net.join(code));
      Game.connected();
    } catch (e) { UI.flash(e.status ? e.message : MSG.noServer); }
  },
  /** Надсилає код і посилання через меню «Поділитися» (не виходячи зі сторінки) */
  shareCode() {
    const text = (S.nick ? S.nick + ' кличе тебе' : 'Грай зі мною') + ' в Морський бій! Код сесії: ' + S.code + '. Відкрий у Safari: ' + location.href.split(/[?#]/)[0];
    if (navigator.share) return navigator.share({ text }).catch(() => {});
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => UI.flash('Повідомлення скопійовано, встав його другові'))
      .catch(() => UI.flash('Назви другові код: ' + S.code));
  },

  /* чат */
  chat() { S.chat.open = true; S.chat.unread = 0; UI.render(); const i = $('#chatin'); if (i) i.focus(); },
  closeChat() { S.chat.open = false; UI.render(); },
  chatSend() { const i = $('#chatin'); S.chat.draft = i ? i.value : ''; Chat.send(); if (i) i.value = ''; UI.renderChat(); },

  /* розстановка */
  place(d) { if (Drag.recent()) return; const err = Placement.place(+d.i); if (err) S.msg = err; UI.render(); },
  rotate() { S.horiz = !S.horiz; UI.render(); },
  random() { Placement.randomize(); UI.render(); },
  clear() { Placement.clear(); UI.render(); },
  ready() { Game.ready(); UI.render(); },
  unready() { Game.unready(); UI.render(); },

  /* бій і реванш */
  aim(d) { if (Drag.recent()) return; Game.aim(+d.i); UI.render(); },
  fire() { Game.fire(); UI.render(); },
  fleet() { S.fleetOpen = true; UI.render(); },
  closeFleet() { S.fleetOpen = false; UI.render(); },
  view(d) { S.endView = d.v; UI.render(); },
  again() { Game.again(); UI.render(); },
  againCancel() { Game.againCancel(); UI.render(); },
  async exit() { Game.leave(); await Net.drain(1500); Actions.toMenu(); },
};

/* ================================================================
   8. BOOT
   ================================================================ */
/* Net повідомляє про події через хуки, щоб не залежати від гри й екрана */
Object.assign(Net.hooks, {
  joined: Game.connected,
  message: Game.onMessage,
  link(up) {
    if (up ? S.link === 'down' : inGame()) { S.link = up ? 'up' : 'down'; UI.render(); }
  },
  closed: msg => Actions.toMenu(msg),
  committed: Session.save,
});
Object.assign(Wake.hooks, { change: UI.render });
Object.assign(Shell.hooks, { change: UI.render });

/* Один обробник кліків на всю сторінку */
document.addEventListener('click', e => {
  Sound.unlock();
  const el = e.target.closest('[data-act]');
  const fn = el && Actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset); }
});

/* Перетягування: починаємо з панелі кораблів або з уже поставленого корабля */
document.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (S.phase !== 'place' || S.meReady || S.fleetOpen) return;
  const dock = e.target.closest('[data-dock]');
  if (dock) return Drag.begin(e, { size: +dock.dataset.dock, horiz: S.horiz, from: 'dock' });
  const cell = e.target.closest('.grid.pl .c.s');
  if (!cell) return;
  const k = Board.shipAt(S.mine, ...Board.rc(+cell.dataset.i));
  if (k >= 0) {
    const sh = S.mine[k];
    Drag.begin(e, { size: sh.length, horiz: sh.length < 2 || sh[0][0] === sh[1][0], from: 'grid', k });
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return Session.save();
  Wake.ping();
  if (inGame()) Keep.on();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'chatin') { e.preventDefault(); Actions.chatSend(); }
});

Session.restore();
UI.render();
Shell.register();
Wake.start();
</script>
</body>
</html>
